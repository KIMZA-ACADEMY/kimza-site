<script>
(async function () {
  var prof = await KZ.requireAuth("student");
  if (!prof) return;
  KZ.shell("home");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var STATUS = { active: "نشط", paused: "متوقف مؤقتاً", graduated: "خريج", stopped: "موقوف", pending: "بانتظار القبول" };
  var KINDS = { weekly: "اختبار أسبوعي", monthly: "امتحان شهري", final: "امتحان نهاية المستوى" };
  var KGROUP = { weekly: "الاختبارات الأسبوعية", monthly: "الامتحانات الشهرية", final: "امتحان نهاية المستوى" };

  var LV = KZ.levelsOf(prof), GR = await KZ.grants();
  var res = await Promise.all([
    sb.from("lessons").select("id,level,num,title,is_open,open_words,open_story,open_audio,open_exercises,open_homework").order("level").order("num"),
    sb.from("tests").select("id,level,kind,minutes,is_open").eq("level", prof.level),
    sb.from("test_attempts").select("test_id,score,total,submitted_at"),
    sb.from("homework_submissions").select("lesson_id,first_score,total"),
    sb.from("announcements").select("title,body,created_at,level").order("created_at", { ascending: false }).limit(5),
    sb.from("level_info").select("*").eq("level", prof.level).maybeSingle(),
    sb.from("attendance").select("status"),
    sb.from("flashcards").select("id").in("level", LV),
    sb.from("card_progress").select("card_id,state,due,first_seen"),
  ]);
  var allCards = res[7].data || [], prog = res[8].data || [];
  var endToday = new Date(); endToday.setHours(23, 59, 59, 999);
  var startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  var cardIds = {}; allCards.forEach(function (c) { cardIds[c.id] = 1; });
  var dueCards = prog.filter(function (p) { return cardIds[p.card_id] && new Date(p.due) <= (p.state === "learning" ? new Date(Date.now() + 20 * 60000) : endToday); }).length;
  var seenIds = {}; prog.forEach(function (p) { seenIds[p.card_id] = 1; });
  var unseen = allCards.filter(function (c) { return !seenIds[c.id]; }).length;
  var newToday = prog.filter(function (p) { return cardIds[p.card_id] && new Date(p.first_seen) >= startToday; }).length;
  var newAvail = Math.min(unseen, Math.max(0, 10 - newToday));
  var learnedCards = prog.filter(function (p) { return cardIds[p.card_id] && p.state === "review"; }).length;
  var allLessons = (res[0].data || []).map(function (l) { return KZ.applyGrant(l, GR); }), tests = res[1].data || [], attempts = res[2].data || [], hw = res[3].data || [];
  var news = res[4].data || [], info = res[5].data, att = res[6].data || [];
  var hwMap = {}; hw.forEach(function (h) { hwMap[h.lesson_id] = h; });
  var atMap = {}; attempts.forEach(function (a) { atMap[a.test_id] = a; });
  // The student only sees lessons the teacher has opened (any part)
  var lessons = allLessons.filter(function (l) { return l.is_open; });
  // ...and only tests that are open now or that he already started
  var myTests = tests.filter(function (t) { return t.is_open || atMap[t.id]; });

  var absences = att.filter(function (a) { return a.status === "absent"; }).length;
  var hwOpen = allLessons.filter(function (l) { return l.open_homework; });
  var doneHw = hwOpen.filter(function (l) { return hwMap[l.id]; }).length;
  var testsDone = myTests.filter(function (t) { return atMap[t.id] && atMap[t.id].submitted_at; }).length;

  function pctOf(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function ring(p, label, sub, color) {
    var r = 34, c = 2 * Math.PI * r, off = c * (1 - p / 100);
    return '<div class="ring"><svg viewBox="0 0 84 84" width="96" height="96" role="img" aria-label="' + esc(label) + " " + p + '%"><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="19" font-weight="800" fill="currentColor" style="font-family:Manrope,Arial,sans-serif">' + p + '%</text></svg><strong>' + esc(label) + '</strong><span class="muted">' + esc(sub) + "</span></div>";
  }

  var html = "";
  var stRows = [];
  try { stRows = (await sb.from("study_time").select("day").order("day", { ascending: false }).limit(90)).data || []; } catch (e) {}
  var dset = {}; stRows.forEach(function (r) { dset[r.day] = 1; });
  var streak = 0, cur = new Date(); function isoD(x) { return x.toISOString().slice(0, 10); }
  if (!dset[isoD(cur)]) cur.setUTCDate(cur.getUTCDate() - 1);
  while (dset[isoD(cur)]) { streak++; cur.setUTCDate(cur.getUTCDate() - 1); }
  var LVN = { A1: "مبتدئ", A2: "أساسي", B1: "متوسط", B2: "فوق المتوسط", C1: "متقدم" };
  var hr = new Date().getHours(), hi = hr < 5 ? "ليلة موفقة" : hr < 12 ? "صباح الخير" : hr < 18 ? "نهارك سعيد" : "مساء الخير";
  var chips = '<span class="dh-chip">المستوى ' + esc(prof.level) + (LVN[prof.level] ? " · " + LVN[prof.level] : "") + "</span>";
  if (prof.status !== "active") chips += '<span class="dh-chip">' + esc(STATUS[prof.status] || prof.status) + "</span>";
  if (streak > 0) chips += '<span class="dh-chip">🔥 ' + streak + (streak === 1 ? " يوم" : " أيام متتالية") + "</span>";
  if (learnedCards > 0) chips += '<span class="dh-chip">📚 ' + learnedCards + " كلمة محفوظة</span>";
  if (hwOpen.length) chips += '<span class="dh-chip">✅ الواجبات ' + doneHw + "/" + hwOpen.length + "</span>";
  var acts = (KZ.on("review") ? '<a class="btn btn-primary" href="review.html">🧠 مراجعة اليوم' + (dueCards ? " (" + dueCards + ")" : "") + "</a>" : "") + '<a class="btn btn-ghost" href="#lessons">📖 دروسي</a>';
  html += '<section class="dhero"><span class="dh-orb"></span><div class="dh-in"><div><div class="dh-hi">' + hi + ' 👋</div><h1>' + esc(prof.full_name) + '</h1><div class="dh-chips">' + chips + '</div><div class="dh-acts">' + acts + '</div></div><div class="dh-lvl" aria-hidden="true">' + esc(prof.level) + "</div></div></section>";

  // ---------- achievements (computed from the student's own data) ----------
  var repCount = 0; try { repCount = (await sb.from("story_reps").select("id", { count: "exact", head: true })).count || 0; } catch (e) {}
  var chKey = "kz-ch-" + KZ.user.id, chLog = {}; try { chLog = JSON.parse(localStorage.getItem(chKey) || "{}"); } catch (e) {}
  var chDays = Object.keys(chLog).length, today = new Date().toISOString().slice(0, 10);
  var BADGES = [
    ["🚀", "بداية الرحلة", 1, 1], ["📝", "أول واجب", hw.length, 1], ["📚", "5 واجبات", hw.length, 5], ["🏆", "10 واجبات", hw.length, 10],
    ["🧠", "25 كلمة محفوظة", learnedCards, 25], ["💎", "100 كلمة", learnedCards, 100], ["👑", "250 كلمة", learnedCards, 250],
    ["🔥", "3 أيام متتالية", streak, 3], ["⚡", "أسبوع متتالٍ", streak, 7], ["🌟", "30 يوماً متتالياً", streak, 30],
    ["🎧", "10 تكرارات للقصة", repCount, 10], ["🗣️", "50 تكراراً", repCount, 50], ["🎤", "100 تكرار", repCount, 100],
    ["🎯", "أول تحدٍّ يومي", chDays, 1], ["🏅", "7 تحديات", chDays, 7], ["✅", "أنهيت اختباراً", testsDone, 1]
  ];
  var got = BADGES.filter(function (b) { return b[2] >= b[3]; }).length;
  if (KZ.on("w_achievements")) html += '<div class="tile" style="margin-bottom:22px"><div class="row" style="border:0;padding:0 0 10px"><h2 style="margin:0">🏅 إنجازاتي</h2><span class="badge gold">' + got + " / " + BADGES.length + '</span></div><div class="bdg-grid">' +
    BADGES.map(function (b) { var on = b[2] >= b[3]; return '<div class="bdg' + (on ? " on" : "") + '" title="' + esc(b[1]) + '"><span class="e">' + b[0] + "</span><b>" + esc(b[1]) + "</b><small>" + (on ? "مكتمل ✓" : Math.min(b[2], b[3]) + " / " + b[3]) + "</small></div>"; }).join("") + "</div></div>";
  var doneToday = chLog[today] != null;
  if (KZ.on("w_challenge")) html += '<div class="tile chall" style="margin-bottom:22px"><div class="row" style="border:0;padding:0"><div><h2 style="margin:0 0 4px">🎯 تحدّي اليوم</h2><p class="muted" style="margin:0">٥ أسئلة سريعة من كلماتك. ' + (doneToday ? "أنجزت تحدّي اليوم بنتيجة " + chLog[today] + "/5 ✅ — يمكنك الإعادة للتدريب." : "اجمع نقاطاً وأكمل سلسلة أيامك!") + '</p></div><button class="btn btn-primary" id="chBtn" type="button">' + (doneToday ? "🔁 أعد التحدي" : "ابدأ التحدي") + "</button></div></div>";
  // ---------- student ideas / votes (teacher-approved) ----------
  var props = [], myVotes = {}, pcounts = {};
  try {
    props = (await sb.from("proposals").select("id,kind,title,body,options,status,user_id").in("status", ["approved", "pending"]).order("created_at", { ascending: false }).limit(12)).data || [];
    ((await sb.from("proposal_votes").select("proposal_id,choice")).data || []).forEach(function (v) { myVotes[v.proposal_id] = v.choice; });
    for (var pi = 0; pi < props.length; pi++) if (props[pi].kind === "vote" && props[pi].status === "approved" && myVotes[props[pi].id] != null) pcounts[props[pi].id] = (await sb.rpc("proposal_counts", { p_id: props[pi].id })).data || [];
  } catch (e) {}
  var PK = { idea: "💡", competition: "🏆", vote: "🗳️" }, shown = props.filter(function (p) { return p.status === "approved" || p.user_id === KZ.user.id; });
  if (KZ.on("w_proposals")) html += '<div class="tile" style="margin-bottom:22px"><div class="row" style="border:0;padding:0 0 8px"><h2 style="margin:0">💬 اقتراحات وتصويتات الأكاديمية</h2><button class="btn btn-ghost sm" id="pSug" type="button">+ اقترح فكرة</button></div>' +
    (shown.length ? shown.map(function (p) {
      var c = pcounts[p.id] || [], tot = c.reduce(function (x, y) { return x + Number(y.n); }, 0), mine = myVotes[p.id];
      return '<div class="row" style="display:block"><strong>' + PK[p.kind] + " " + esc(p.title) + "</strong>" + (p.status === "pending" ? ' <span class="badge">بانتظار موافقة المعلم</span>' : "") + (p.body ? '<p class="muted" style="margin:4px 0">' + esc(p.body) + "</p>" : "") +
        (p.kind === "vote" && p.status === "approved" ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">' + (p.options || []).map(function (o, i) {
          var k = c.filter(function (x) { return x.choice === i; })[0], n = k ? Number(k.n) : 0;
          return '<button class="btn ' + (mine === i ? "btn-primary" : "btn-ghost") + ' sm" data-pv="' + p.id + ":" + i + '" type="button">' + esc(o) + (mine != null ? " · " + n + (tot ? " (" + Math.round(n * 100 / tot) + "%)" : "") : "") + "</button>"; }).join("") + "</div>" : "") + "</div>";
    }).join("") : '<p class="muted" style="margin:0">لا توجد اقتراحات الآن. شاركنا فكرتك: مسابقة، نشاط، أو تصويت.</p>') + "</div>";



  if (prof.must_change_password) {
    html += '<div class="infobox"><strong>غيّر كلمة المرور المؤقتة الآن</strong><div class="form" style="margin-top:10px"><div><label for="np">كلمة مرور جديدة (8 أحرف على الأقل)</label><input id="np" type="password" dir="ltr" autocomplete="new-password"></div><div><button class="btn btn-primary sm" id="npBtn" type="button">حفظ كلمة المرور</button></div></div></div>';
  }
  if (prof.status === "pending") html += '<div class="infobox">🎉 أهلاً بك! أنهيت اختبار تحديد المستوى وطلبك الآن عند المعلم للموافقة. عندما يقبلك ستُفتح لك الدروس هنا. يمكنك الآن تغيير كلمة المرور من الأعلى.</div>';
  else if (prof.status !== "active") html += '<div class="warnbox">حسابك ليس نشطاً حالياً، لذلك قد لا تظهر بعض المواد. تواصل مع المعلم.</div>';
  if (absences > 3) html += '<div class="warnbox">لديك ' + absences + ' غيابات. أكثر من 3 غيابات قد تعرّضك لعدم اجتياز الاختبار النهائي. تواصل مع المعلم، ويمكنك متابعة مواد الدروس وحل الواجبات لتعويض ما فاتك.</div>';

  // quick links
  var q = [["#lessons", "📚", "الدروس", KZ.on("lessons")], ["review.html", "🧠", "المراجعة", KZ.on("review")], ["#t-weekly", "📝", "الاختبارات الأسبوعية", KZ.on("tests")], ["#t-monthly", "🏆", "الامتحانات الشهرية", KZ.on("tests")], ["certificates.html", "🎓", "الشهادات", KZ.on("certificates")], ["speaking.html", "🗣", "المحادثة", KZ.on("speaking")], ["attendance.html", "📅", "الحضور", KZ.on("attendance")]];
  html += '<nav class="quick" aria-label="روابط سريعة">' + q.filter(function (x) { return x[3]; }).map(function (x) { return '<a href="' + x[0] + '"><span aria-hidden="true">' + x[1] + "</span>" + x[2] + "</a>"; }).join("") + "</nav>";

  // progress rings
  html += '<h2 style="margin-top:22px">تقدّمك نحو هدفك</h2><div class="tile rings">' +
    ring(pctOf(lessons.length, allLessons.length), "المستوى", lessons.length + " من " + allLessons.length + " درساً", "var(--gold)") +
    ring(pctOf(doneHw, hwOpen.length), "الواجبات", doneHw + " من " + hwOpen.length, "#2F9E5B") +
    ring(pctOf(learnedCards, allCards.length), "الكلمات", learnedCards + " من " + allCards.length + " كلمة", "#3B7DD8") +
    ring(pctOf(testsDone, myTests.length), "الاختبارات", testsDone + " من " + myTests.length, "var(--burgundy, #7A0F2D)") + "</div>";

  // to-do
  var todo = [];
  if (KZ.on("review") && dueCards + newAvail > 0) todo.push('<div class="row"><div><strong>مراجعة البطاقات</strong><div class="muted">' + dueCards + ' للمراجعة · ' + newAvail + ' جديدة اليوم</div></div><a class="btn btn-primary sm" href="review.html">ابدأ</a></div>');
  (KZ.on("homework") && KZ.on("lessons") ? lessons.filter(function (l) { return l.open_homework && !hwMap[l.id]; }) : []).forEach(function (l) {
    todo.push('<div class="row"><div><strong>واجب الدرس ' + l.num + '</strong><div class="muted">لم يُسلَّم بعد</div></div><a class="btn btn-primary sm" href="lesson.html?id=' + esc(l.id) + '">افتح</a></div>');
  });
  (KZ.on("tests") ? myTests.filter(function (t) { return t.is_open && !atMap[t.id]; }) : []).forEach(function (t) {
    todo.push('<div class="row"><div><strong>' + esc(KINDS[t.kind]) + '</strong><div class="muted">مفتوح الآن · ' + t.minutes + ' دقيقة</div></div><a class="btn btn-primary sm" href="test.html?id=' + esc(t.id) + '">ابدأ</a></div>');
  });
  // story practice: repeat the story + shadowing (latest lesson whose story is open)
  var doneRows = [];
  var stLessons = lessons.filter(function (l) { return l.open_story || l.open_audio; });
  if (KZ.on("lessons") && stLessons.length) {
    var stL = stLessons.slice().sort(function (a, b) { return (LV.indexOf(a.level) - LV.indexOf(b.level)) || (a.num - b.num); }).pop();
    var repToday = 0; try { repToday = (await sb.from("story_reps").select("id", { count: "exact", head: true }).gte("created_at", startToday.toISOString())).count || 0; } catch (e) {}
    var target = 3; try { var fsr = (await sb.from("fluency_settings").select("daily_target").eq("id", 1).maybeSingle()).data; if (fsr && fsr.daily_target) target = fsr.daily_target; } catch (e) {}
    var href = "lesson.html?id=" + encodeURIComponent(stL.id) + "&tab=story";
    var repRow = '<div class="row"><div><strong>🔁 كرّر القصة وظلِّلها (الدرس ' + stL.num + ')</strong><div class="muted">استمع للقصة وكرّر الجمل معها بنفس السرعة والنبرة (Shadowing) · اليوم: ' + repToday + " / " + target + "</div></div>";
    if (repToday >= target) doneRows.push(repRow + '<span class="badge ok">تمّ ✅</span></div>'); else todo.push(repRow + '<a class="btn btn-primary sm" href="' + href + '">ابدأ</a></div>');
  }
  // tasks made by the teacher (for everybody, a level, a group or this student)
  try {
    var dts = (await sb.from("dtasks").select("*").order("created_at", { ascending: false }).limit(40)).data || [];
    var dtDone = {}; ((await sb.from("dtask_done").select("task_id").eq("user_id", KZ.user.id)).data || []).forEach(function (x) { dtDone[x.task_id] = 1; });
    var dtAtt = {}; ((await sb.from("skill_exam_attempts").select("exam_id,submitted_at").eq("user_id", KZ.user.id)).data || []).forEach(function (a) { if (a.submitted_at) dtAtt[a.exam_id] = 1; });
    var dtExams = {}; var exIds = dts.filter(function (t) { return t.exam_id; }).map(function (t) { return t.exam_id; });
    if (exIds.length) ((await sb.from("skill_exams").select("id,title,minutes,status").in("id", exIds)).data || []).forEach(function (e) { dtExams[e.id] = e; });
    dts.forEach(function (t) {
      var isEx = t.kind === "skill_exam" && t.exam_id, ex = isEx ? dtExams[t.exam_id] : null;
      var finished = isEx ? !!dtAtt[t.exam_id] : !!dtDone[t.id];
      var late = t.due_at && new Date(t.due_at) < new Date() && !finished;
      var sub = esc(t.details || "") + (isEx && ex ? (t.details ? " · " : "") + "المدة " + ex.minutes + " دقيقة" : "") + (t.due_at ? ' · <span' + (late ? ' style="color:#c62828"' : "") + ">آخر موعد " + new Date(t.due_at).toLocaleString("ar", { dateStyle: "short", timeStyle: "short" }) + "</span>" : "");
      var head = '<div class="row"><div><strong>' + (isEx ? "📝 " : "📌 ") + esc(t.title) + '</strong><div class="muted">' + sub + "</div></div>";
      if (finished) { doneRows.push(head + '<span class="badge ok">تمّ ✅</span></div>'); return; }

})();
