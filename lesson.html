<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الدرس · KIMZA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwvxuz7f">
<link rel="stylesheet" href="app.css?v=mwvxuz7f">

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwvxuz7f"></script>
<script src="portal-i18n.js?v=mwvxuz7f"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("any");
  if (!prof) return;
  KZ.shell("home");
  KZ.blockCopy();
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var id = new URLSearchParams(location.search).get("id") || "";
  var IS_T = prof.role === "teacher"; // the teacher previews the lesson exactly as the student sees it (nothing is saved)
  var BACK = IS_T ? "admin.html#lessons" : "dashboard.html";

  var l = await sb.from("lessons").select("id,num,level,title,open_words,open_story,open_audio,open_exercises,open_homework").eq("id", id).maybeSingle();
  if (!l.data) {
    app.innerHTML = '<h1>الدرس غير متاح</h1><p><a class="btn btn-primary" href="dashboard.html">العودة</a></p>';
    return;
  }
  var L = l.data;
  var TABS = [
    ["words", "الكلمات", L.open_words || IS_T],
    ["story", "القصة والصوت", L.open_story || L.open_audio || IS_T],
    ["exercises", "التمارين", L.open_exercises || IS_T],
    ["homework", "الواجب", (L.open_homework && KZ.on("homework")) || IS_T]
  ];
  var first = (TABS.filter(function (t) { return t[2]; })[0] || TABS[0])[0];
  var content = {};
  var c = await sb.from("lesson_content").select("kind,body").eq("lesson_id", id);
  (c.data || []).forEach(function (x) { content[x.kind] = x.body; });
  var done = IS_T ? { data: null } : await sb.from("homework_submissions").select("first_score,total").eq("lesson_id", id).maybeSingle();

  var html = '<p><a href="' + BACK + '">&larr; العودة</a></p><h1>الدرس ' + L.num + ' <span class="en muted" style="font-size:.6em">' + esc(L.title || "") + "</span></h1>";
  html += '<div class="tabs" role="tablist">' + TABS.map(function (t) {
    return '<button data-t="' + t[0] + '" aria-selected="' + (t[0] === first ? "true" : "false") + '">' + (t[2] ? "" : "🔒 ") + t[1] + "</button>";
  }).join("") + '</div><div id="pane"></div>';
  app.innerHTML = html;

  function locked(name) {
    return '<div class="tile"><h3>🔒 ' + name + ' مغلق</h3><p class="muted">سيفتحه المعلم في الوقت المناسب.</p></div>';
  }

  function wireFs() {
    document.querySelectorAll("[data-fs]").forEach(function (b) {
      b.addEventListener("click", function () {
        var w = document.getElementById(b.getAttribute("data-fs")), on = !w.classList.contains("fs");
        w.classList.toggle("fs", on); document.body.classList.toggle("fs-open", on);
        b.textContent = on ? "✕ إغلاق" : "⛶ ملء الشاشة";
        try { if (on && w.requestFullscreen) w.requestFullscreen(); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      });
    });
    document.addEventListener("fullscreenchange", function () {
      if (!document.fullscreenElement) { document.querySelectorAll(".fswrap.fs").forEach(function (w) { w.classList.remove("fs"); var bb = w.querySelector("[data-fs]"); if (bb) bb.textContent = "⛶ ملء الشاشة"; }); document.body.classList.remove("fs-open"); }
    });
  }
  var mediaStop = function () {};
  function stopMedia() { try { mediaStop(); } catch (e) {} mediaStop = function () {}; }
  async function show(t) {
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-t") === t ? "true" : "false"); });
    var pane = document.getElementById("pane");
    var tab = TABS.filter(function (x) { return x[0] === t; })[0];
    if (!tab[2]) { pane.innerHTML = locked(tab[1]); return; }

    stopMedia();
    var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];
    if (t === "words") {
      pane.innerHTML = '<div class="tile"><p class="muted">جارٍ تحميل الكلمات...</p></div>';
      var wr = await sb.from("flashcards").select("id,english,arabic,example_en,example_ar,image,audio,example_audio").eq("level", L.level).eq("lesson_num", L.num).order("id");
      var words = wr.data || [];
      if (!words.length) { pane.innerHTML = '<div class="tile"><pre style="white-space:pre-wrap;font-family:inherit;direction:auto;margin:0;line-height:1.9">' + esc(content.words || "") + "</pre></div>"; return; }
      var MB = window.KIMZA_SUPABASE.url + "/storage/v1/object/public/card-media/";
      var bar = '<div class="audiobar"><label for="wSpd">سرعة الصوت</label><select id="wSpd">' + SPEEDS.map(function (v) { return '<option value="' + v + '"' + (v === 1 ? " selected" : "") + ">" + v + "x</option>"; }).join("") + '</select><label class="wloop"><input type="checkbox" id="wLoop"> 🔁 كرّر الصوت الذي أضغط عليه حتى أضغط عليه مرة أخرى</label></div>';
      pane.innerHTML = bar + '<div class="wgrid">' + words.map(function (w, i) {
        return '<article class="wcard"><button class="wimg" type="button" data-a="' + esc(w.audio || "") + '" data-tx="' + esc(w.english) + '" data-k="w' + i + '" aria-label="استمع إلى ' + esc(w.english) + '">' +
          (w.image ? '<img src="' + esc(MB + w.image) + '" alt="" loading="lazy">' : '<span class="wnone" aria-hidden="true">🔊</span>') + '<span class="wplay" aria-hidden="true">🔊</span></button>' +
          '<div class="wtxt"><div class="wen" dir="ltr">' + esc(w.english) + '</div><div class="war">' + esc(w.arabic || "") + '</div>' +
          (w.example_en ? '<button class="wex" type="button" data-a="' + esc(w.example_audio || "") + '" data-tx="' + esc(w.example_en) + '" data-k="e' + i + '"><span class="wen2" dir="ltr">' + esc(w.example_en) + '</span><span class="war2">' + esc(w.example_ar || "") + '</span><span class="wplay2" aria-hidden="true">🔊</span></button>' : "") + "</div></article>";
      }).join("") + "</div>";
      var wSpeed = 1, wLoop = false, wKey = null, wAudio = null;
      function wStop() { wKey = null; if (wAudio) { try { wAudio.pause(); } catch (e) {} wAudio = null; } try { speechSynthesis.cancel(); } catch (e) {} pane.querySelectorAll(".playing").forEach(function (x) { x.classList.remove("playing"); }); }
      mediaStop = wStop;
      function wPlay(btn) {
        var key = btn.getAttribute("data-k");
        if (wKey === key) { wStop(); return; }
        wStop(); wKey = key; btn.classList.add("playing");
        var file = btn.getAttribute("data-a"), tx = btn.getAttribute("data-tx");
        (function run() {
          if (wKey !== key) return;
          function again() { if (wKey === key && wLoop) setTimeout(run, 700); else if (wKey === key) wStop(); }
          if (file) { wAudio = new Audio(MB + file); wAudio.playbackRate = wSpeed; wAudio.addEventListener("ended", again); wAudio.play().catch(function () { wStop(); }); }
          else if ("speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(tx); u.lang = "en-GB"; u.rate = Math.min(2, 0.9 * wSpeed); u.onend = again; speechSynthesis.speak(u); }
        })();
      }
      pane.querySelectorAll("[data-k]").forEach(function (b2) { b2.addEventListener("click", function () { wPlay(b2); }); });
      document.getElementById("wSpd").addEventListener("change", function (ev) { wSpeed = Number(ev.target.value); if (wAudio) wAudio.playbackRate = wSpeed; });
      document.getElementById("wLoop").addEventListener("change", function (ev) { wLoop = ev.target.checked; });
      return;
    }
    if (t === "story") {
      var h = "";
      if (L.open_story || IS_T) {
        h += '<div id="simgs" class="simgs"></div>';
        h += '<div class="tile"><pre class="story" style="white-space:pre-wrap;font-family:inherit;direction:auto;margin:0;line-height:2;font-size:1.1rem">' + esc(content.story || "") + "</pre></div>";
      }
      h += '<div id="saudio"></div>';
      pane.innerHTML = h;
      if (L.open_story || IS_T) {
        // story pictures: A1-L01-story-1.jpg, -2 ... in the public lesson-images bucket (shown in order)
        var IB = window.KIMZA_SUPABASE.url + "/storage/v1/object/public/lesson-images/" + id + "-story-";
        (async function () {
          var box = document.getElementById("simgs");
          for (var n = 1; n <= 20 && box; n++) {
            var okUrl = null;
            var exts = ["jpg", "jpeg", "png", "webp"];
            for (var q = 0; q < exts.length; q++) {
              var u = IB + n + "." + exts[q];
              var ok = await new Promise(function (res) { var im = new Image(); im.onload = function () { res(true); }; im.onerror = function () { res(false); }; im.src = u; });
              if (ok) { okUrl = u; break; }
            }
            if (!okUrl) break;
            box.insertAdjacentHTML("beforeend", '<img src="' + esc(okUrl) + '" alt="" loading="lazy">');
          }
        })();
      }
      var sa = document.getElementById("saudio");
      if (!L.open_audio && !IS_T) { if (!L.open_story) sa.innerHTML = locked("الصوت"); return; }
      sa.innerHTML = '<div class="tile"><p class="muted">جارٍ تحميل الصوت...</p></div>';
      var s = await sb.storage.from("lesson-audio").createSignedUrl(id + ".mp3", 3600);
      if (s.error || !s.data) { sa.innerHTML = '<div class="tile"><p class="muted">لم يرفع المعلم ملف الصوت لهذا الدرس بعد.</p></div>'; return; }
      var dl = await sb.storage.from("lesson-audio").createSignedUrl(id + ".mp3", 3600, { download: id + ".mp3" });
      sa.innerHTML = '<div class="tile"><h3>🎧 استمع إلى القصة</h3><audio id="au" controls controlsList="nodownload" preload="none" style="width:100%" src="' + esc(s.data.signedUrl) + '"></audio>' +
        '<div class="audiobar"><label for="auSpd">السرعة</label><select id="auSpd">' + SPEEDS.map(function (v) { return '<option value="' + v + '"' + (v === 1 ? " selected" : "") + ">" + v + "x</option>"; }).join("") + '</select>' +
        '<button class="btn btn-ghost sm" id="auLoop" type="button" aria-pressed="false">🔁 تكرار تلقائي</button>' +
        (dl.data ? '<a class="btn btn-primary sm" href="' + esc(dl.data.signedUrl) + '" download>⬇ تحميل الصوت</a>' : "") + '</div>' +
        '<p class="muted">استمع ثم أعد القصة جملة جملة. غيّر السرعة وفعّل التكرار ليعيد الصوت دون أن تضغط كل مرة.</p></div>';
      var au = document.getElementById("au");
      mediaStop = function () { try { au.pause(); } catch (e) {} };
      document.getElementById("auSpd").addEventListener("change", function (ev) { au.playbackRate = Number(ev.target.value); });
      au.addEventListener("play", function () { au.playbackRate = Number(document.getElementById("auSpd").value); });
      document.getElementById("auLoop").addEventListener("click", function (ev) { au.loop = !au.loop; ev.target.setAttribute("aria-pressed", String(au.loop)); ev.target.className = "btn " + (au.loop ? "btn-primary" : "btn-ghost") + " sm"; ev.target.textContent = au.loop ? "⏹ إيقاف التكرار" : "🔁 تكرار تلقائي"; });
      return;
    }
    if (t === "exercises") {
      pane.innerHTML = '<div class="infobox">تمارين الحصة التفاعلية لهذا الدرس.</div><div class="fswrap" id="exw"><div class="fsbar"><button class="btn btn-ghost sm" type="button" data-fs="exw">⛶ ملء الشاشة</button></div><iframe class="frame" id="ex" sandbox="allow-scripts allow-same-origin allow-forms" title="Exercises"></iframe></div>';
      wireFs();
      var exf = document.getElementById("ex");
      exf.addEventListener("load", function () { try { KZ.blockCopyIn(exf.contentDocument); } catch (e) {} });
      exf.srcdoc = content["class"] || "";
      return;
    }
    // homework: ask for confirmation before the timer starts
    var dm = /DURATION\s*=\s*(\d+)\s*\*\s*60/.exec(content.homework || ""), dmin = dm ? Number(dm[1]) : 15;
    if (!IS_T && !(done && done.data)) {
      var started = await sb.from("homework_starts").select("lesson_id").eq("lesson_id", id).maybeSingle();
      if (!(started.data)) {
        var ok = await KZ.confirmBox("هل أنت جاهز للواجب؟", "<p>سيبدأ الواجب الآن، ومدته <strong>" + dmin + " دقيقة</strong>.</p><p>يبدأ العدّاد فور الضغط على «نعم، ابدأ» <strong>ولا يتوقف</strong> حتى لو خرجت من الصفحة. درجتك الأولى هي التي تُحتسب.</p>", "نعم، ابدأ الواجب", "ليس بعد");
        if (!ok) { pane.innerHTML = '<div class="tile"><h3>الواجب جاهز</h3><p class="muted">اضغط عندما تكون مستعداً. لن يبدأ العدّاد قبل ذلك.</p><p><button class="btn btn-primary" id="hwGo" type="button">ابدأ الواجب</button></p></div>'; document.getElementById("hwGo").addEventListener("click", function () { show("homework"); }); return; }
      }
    }
    var note = done && done.data
      ? '<div class="infobox">سلّمت هذا الواجب. درجتك الأولى المحتسبة: <strong>' + done.data.first_score + " / " + done.data.total + "</strong>. المحاولات التالية للتدريب فقط ولا تُحتسب.</div>"
      : '<div class="infobox">ادخل اسمك ثم أجب. <strong>درجتك الأولى هي التي تُحتسب</strong> وتُحفظ تلقائياً. <strong>المؤقت يبدأ من أول فتح للواجب ولا يتوقف</strong> حتى لو خرجت من الصفحة.</div>';
    pane.innerHTML = note + '<div class="fswrap" id="hww"><div class="fsbar"><button class="btn btn-ghost sm" type="button" data-fs="hww">⛶ ملء الشاشة</button></div><iframe class="frame" id="hw" sandbox="allow-scripts allow-same-origin allow-forms" title="Homework"></iframe></div>';
    wireFs();
    var fr = document.getElementById("hw");
    var elapsed = 0, hwHtml = content.homework || "";
    if (!IS_T && !(done && done.data)) {
      var st = await sb.rpc("start_homework", { p_lesson: id });
      if (!st.error && typeof st.data === "number") elapsed = st.data;
    }
    var T0 = Date.now() - elapsed * 1000, SKEY = "kz-hw-" + KZ.user.id + "-" + id;
    // The timer starts the first time the homework is opened and keeps running, even if the student leaves the page.
    hwHtml = hwHtml.replace("clearInterval(timerId); left = DURATION;", "clearInterval(timerId); left = (window.__KZ_FIRST ? (window.__KZ_FIRST = false, Math.max(1, DURATION - Math.floor((Date.now() - window.__KZ_T0) / 1000))) : DURATION);");
    hwHtml = "<script>window.__KZ_FIRST=" + (done && done.data ? "false" : "true") + ";window.__KZ_T0=" + T0 + ";<" + "/script>" + hwHtml;
    fr.addEventListener("load", function () {
      var w = fr.contentWindow;
      try { KZ.blockCopyIn(w.document); } catch (e) {}
      // the account name is used automatically: hide the name field
      try {
        var nm = w.document.getElementById("sname");
        if (nm) { nm.value = prof.full_name || ""; var wrap = nm.closest(".name-row") || nm.parentNode; wrap.style.display = "none"; }
        var ne = w.document.getElementById("nameErr"); if (ne) ne.style.display = "none";
        // ask before the first submission: no better grade afterwards
        var origSubmit = w.submitHw, asked = !!(done && done.data);
        w.submitHw = async function (auto) {
          if (auto === true || asked || IS_T) return origSubmit(auto);
          var go = await KZ.confirmBox("تسليم الواجب", "<p>بعد التسليم <strong>لا يمكنك الحصول على درجة أفضل</strong>، فدرجتك الأولى هي التي تُحتسب.</p><p>راجع إجاباتك جيداً، فلا يزال لديك وقت.</p>", "سلّم الآن", "أراجع إجاباتي");
          if (!go) return;
          asked = true; return origSubmit(auto);
        };
      } catch (e) {}
      // keep the typed answers if the student leaves and comes back
      try {
        var d = w.document, saved = JSON.parse(localStorage.getItem(SKEY) || "{}");
        if (!(done && done.data)) {
          d.querySelectorAll("input[type=radio]").forEach(function (r) { if (saved["r:" + r.name] === r.value) r.checked = true; });
          d.querySelectorAll("input[type=text],textarea").forEach(function (t) { if (t.id && saved["t:" + t.id]) t.value = saved["t:" + t.id]; });
          var onIn = function (e) {
            var t = e.target; if (!t) return;
            if (t.type === "radio") saved["r:" + t.name] = t.value; else if (t.id) saved["t:" + t.id] = t.value;
            try { localStorage.setItem(SKEY, JSON.stringify(saved)); } catch (x) {}
          };
          d.addEventListener("input", onIn); d.addEventListener("change", onIn);
        }
      } catch (e) {}
      // The homework page "sends" its result with fetch. Here we save it to the student's own record instead.
      w.fetch = async function (url, opts) {
        if (IS_T) return { ok: true };
        try {
          var p = JSON.parse(opts.body);
          var r = await sb.from("homework_submissions").insert({
            user_id: KZ.user.id, lesson_id: id, first_score: Number(p.first_score) || 0, total: Number(p.total) || 0,
            answers: { final_score: p.final_score, self_corrections: p.self_corrections, mistakes: p.mistakes, answers: p.answers, name: p.name }
          });
          if (!r.error) KZ.toast("تم حفظ درجتك الأولى.");
        } catch (e) {}
        return { ok: true };
      };
    });
    fr.srcdoc = hwHtml;
  }
  document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-t")); }); });
  show(first);
})();

</script>
</body>
</html>
