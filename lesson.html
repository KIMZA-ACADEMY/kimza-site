<script>
(async function () {
  var prof = await KZ.requireAuth("any");
  if (!prof) return;
  KZ.shell("home");
  KZ.blockCopy();
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var id = new URLSearchParams(location.search).get("id") || "";
  var IS_T = prof.role === "teacher"; // the teacher previews the lesson exactly as the student sees it (nothing is saved)
  var BACK = IS_T ? "admin.html#lessons" : "dashboard.html";

  var l = await sb.from("lessons").select("id,num,level,title,open_words,open_story,open_audio,open_exercises,open_homework,hidden_tabs").eq("id", id).maybeSingle();
  if (!l.data) {
    app.innerHTML = '<h1>الدرس غير متاح</h1><p><a class="btn btn-primary" href="dashboard.html">العودة</a></p>';
    return;
  }
  var L = l.data;
  if (!IS_T) KZ.applyGrant(L, await KZ.grants());
  var LAB = {};
  try { var lt = await sb.from("site_texts").select("key,ar").like("key", "tab.%"); (lt.data || []).forEach(function (x) { if (x.ar) LAB[x.key] = x.ar; }); } catch (e) {}
  var TABS = [
    ["words", LAB["tab.words"] || "الكلمات", L.open_words || IS_T],
    ["story", LAB["tab.story"] || "القصة والصوت", L.open_story || L.open_audio || IS_T],
    ["exercises", LAB["tab.exercises"] || "التمارين", L.open_exercises || IS_T],
    ["homework", LAB["tab.homework"] || "الواجب", (L.open_homework && KZ.on("homework")) || IS_T],
    ["files", LAB["tab.files"] || "المجلد", true]
  ];
  var HID = L.hidden_tabs || [];
  if (!IS_T) TABS = TABS.filter(function (t) { return HID.indexOf(t[0]) < 0; });
  if (!TABS.length) TABS = [["words", "الكلمات", false]];
  var first = (TABS.filter(function (t) { return t[2]; })[0] || TABS[0])[0];
  var ME = null;
  try { if (!IS_T) { var mp = await sb.from("student_prefs").select("nickname,emoji,color").maybeSingle(); if (mp.data && mp.data.nickname) ME = mp.data; } } catch (e) {}
  function unifyCss() {
    var cs = getComputedStyle(document.documentElement), g = function (n, d) { return (cs.getPropertyValue(n) || "").trim() || d; };
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    var bg = g("--bg", "#07162F"), sf = g("--surface", "#0B1F44"), sf2 = g("--surface-2", sf), tx = g("--text", "#F8F4E9"), mu = g("--muted", "#CBD5E1"), ln = g("--line", "#1F3B6B"), ac = g("--gold", "#D4AF37"), lk = g("--link", "#7A0F2D");
    var btn = dark ? "#7A0F2D" : lk, hc = dark ? ac : lk;
    return "<style id='kzUnify'>:root{--navy:" + g("--navy", "#0B1F44") + ";--gold:" + ac + "}" +
      "html,body{background:" + bg + "!important;color:" + tx + "!important}" +
      ".top,header{background:transparent!important;border:0!important;box-shadow:none!important;padding:8px 8px 0!important}.top:after{display:none!important}.brand{display:none!important}.title,.lesson{color:" + tx + "!important}" +
      ".bar,.card,.section,#result,#score,.plan span{background:" + sf + "!important;border:1px solid " + ln + "!important;color:" + tx + "!important;border-radius:20px!important;box-shadow:0 10px 26px rgba(11,31,68,.12)!important}" +
      ".q,.setup-row,.sentence,.picked .p,.prompt,.reveal-box,#gramPanel>div,.rule,.scene,.timer,.score{background:" + sf2 + "!important;color:" + tx + "!important;border-color:" + ln + "!important}" +
      "h1,h2,.card h2,.section h2,.q .text,.reveal,label,.fb,.title{color:" + tx + "!important}h3,#gramPanel h3,.prompt small,.blank{color:" + hc + "!important}.blank{border-bottom-color:" + hc + "!important}" +
      "input,textarea,select,input[type=number]{background:" + bg + "!important;color:" + tx + "!important;border:1.5px solid " + ln + "!important;border-radius:12px!important}input:focus,textarea:focus,select:focus{outline:2px solid " + ac + "!important}" +
      ".opts label,.chip,.btn.ghost{background:" + bg + "!important;color:" + tx + "!important;border:1.5px solid " + ln + "!important;border-radius:12px!important}.opts label:hover,.chip:hover{border-color:" + ac + "!important}" +
      ".btn,.btn.gold{background:" + btn + "!important;color:#fff!important;border:1px solid " + ac + "!important;border-radius:999px!important;transition:transform .15s,filter .15s!important}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}" +
      ".badge{background:" + btn + "!important;color:#F4D98A!important}.note,.hint,.rules,.selfnote,.why,footer{color:" + mu + "!important}.timer{color:" + hc + "!important}" +
      "main{max-width:880px!important;margin-top:8px!important}</style>";
  }
  function autoFit(fr) {
    try {
      var d = fr.contentDocument; if (!d || !d.documentElement) return;
      var set = function () { if (fr.closest && fr.closest(".fs")) { fr.style.height = ""; return; } fr.style.height = Math.max(Math.round(innerHeight * 0.7), d.documentElement.scrollHeight + 6) + "px"; };
      set(); if (window.ResizeObserver) new ResizeObserver(set).observe(d.documentElement); else setInterval(set, 900);
    } catch (e) {}
  }
  function withMe(html) {
    var out = withMe0(html);
    if (!out) return out;
    var st = unifyCss();
    return /<\/body>/i.test(out) ? out.replace(/<\/body>/i, function () { return st + "</body>"; }) : out + st;
  }
  function withMe0(html) {
    if (!ME || !html) return html;
    var cfg = JSON.stringify({ name: ME.nickname, emoji: ME.emoji, color: ME.color }).replace(/</g, "\\u003c");
    var js = "<script>window.KZ_ME=" + cfg + ";document.addEventListener('DOMContentLoaded',function(){try{var m=window.KZ_ME;var b=document.createElement('div');b.id='kzMe';b.style.cssText='position:fixed;top:8px;left:8px;z-index:99999;display:flex;align-items:center;gap:8px;background:#fff;color:#0B1F44;border:3px solid '+m.color+';border-radius:30px;padding:3px 14px 3px 4px;font:700 15px Tajawal,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';var e=document.createElement('span');e.style.cssText='font-size:26px;line-height:1';e.textContent=m.emoji;var n=document.createElement('span');n.textContent=m.name;b.appendChild(e);b.appendChild(n);document.body.appendChild(b);document.querySelectorAll('.kz-me-emoji').forEach(function(x){x.textContent=m.emoji});document.querySelectorAll('.kz-me-name').forEach(function(x){x.textContent=m.name})}catch(err){}});<" + "/script>";
    return /<\/body>/i.test(html) ? html.replace(/<\/body>/i, function () { return js + "</body>"; }) : html + js;
  }
  var content = {};
  var c = await sb.from("lesson_content").select("kind,body").eq("lesson_id", id);
  (c.data || []).forEach(function (x) { content[x.kind] = x.body; });
  var done = IS_T ? { data: null } : await sb.from("homework_submissions").select("first_score,total").eq("lesson_id", id).maybeSingle();

  var html = '<p><a href="' + BACK + '">&larr; العودة</a></p><h1>الدرس ' + L.num + ' <span class="en muted" style="font-size:.6em">' + esc(L.title || "") + "</span></h1>";
  html += '<div class="tabs" role="tablist">' + TABS.map(function (t) {
    return '<button data-t="' + t[0] + '" aria-selected="' + (t[0] === first ? "true" : "false") + '">' + (t[2] ? "" : "🔒 ") + t[1] + "</button>";
  }).join("") + '</div>' + (IS_T ? '<p style="margin:8px 0"><button class="btn btn-ghost sm" id="labEdit" type="button">✎ تعديل أسماء الأزرار</button></p><div id="labBox"></div>' : "") + '<div id="pane"></div>';
  app.innerHTML = html;
  if (IS_T) document.getElementById("labEdit").addEventListener("click", function () {
    var names = [["words", "الكلمات"], ["story", "القصة والصوت"], ["exercises", "التمارين"], ["homework", "الواجب"], ["files", "المجلد"]];
    var bx = document.getElementById("labBox");
    bx.innerHTML = '<div class="tile" style="margin:8px 0"><p class="muted">غيّر اسم كل زر، وسيظهر الاسم الجديد لكل الطلاب في كل الدروس.</p><div class="form" style="display:grid;gap:8px;max-width:420px">' +
      names.map(function (n) { return '<label>' + n[1] + '</label><input data-lab="tab.' + n[0] + '" value="' + esc(LAB["tab." + n[0]] || n[1]) + '">'; }).join("") +
      '</div><p style="margin:10px 0 0"><button class="btn btn-primary sm" id="labSave" type="button">حفظ</button> <button class="btn btn-ghost sm" id="labCancel" type="button">إلغاء</button></p></div>';
    document.getElementById("labCancel").addEventListener("click", function () { bx.innerHTML = ""; });
    document.getElementById("labSave").addEventListener("click", async function () {
      var rows = Array.prototype.map.call(bx.querySelectorAll("[data-lab]"), function (i) { return { key: i.getAttribute("data-lab"), ar: i.value.trim() }; });
      var r2 = await sb.from("site_texts").upsert(rows);
      if (r2.error) { KZ.toast("تعذر الحفظ: " + r2.error.message, true); return; }
      KZ.toast("تم الحفظ."); location.reload();
    });
  });

  function locked(name) {
    return '<div class="tile"><h3>🔒 ' + name + ' مغلق</h3><p class="muted">سيفتحه المعلم في الوقت المناسب.</p></div>';
  }

  function wireFs() {
    document.querySelectorAll("[data-fs]").forEach(function (b) {
      b.addEventListener("click", function () {
        var w = document.getElementById(b.getAttribute("data-fs")), on = !w.classList.contains("fs");
        w.classList.toggle("fs", on); document.body.classList.toggle("fs-open", on);
        b.textContent = on ? "✕ إغلاق" : "⛶ ملء الشاشة";
        try { if (on && w.requestFullscreen) w.requestFullscreen(); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      });
    });
    document.addEventListener("fullscreenchange", function () {
      if (!document.fullscreenElement) { document.querySelectorAll(".fswrap.fs").forEach(function (w) { w.classList.remove("fs"); var bb = w.querySelector("[data-fs]"); if (bb) bb.textContent = "⛶ ملء الشاشة"; }); document.body.classList.remove("fs-open"); }
    });
  }
  var mediaStop = function () {};
  function stopMedia() { try { mediaStop(); } catch (e) {} mediaStop = function () {}; }
  async function show(t) {
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-t") === t ? "true" : "false"); });
    var pane = document.getElementById("pane");
    var tab = TABS.filter(function (x) { return x[0] === t; })[0];
    if (!tab[2]) { pane.innerHTML = locked(tab[1]); return; }

    stopMedia();
    var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];
    if (t === "words") {
      pane.innerHTML = '<div class="tile"><p class="muted">جارٍ تحميل الكلمات...</p></div>';
      var wr = await sb.from("flashcards").select("id,english,arabic,example_en,example_ar,image,audio,example_audio").eq("level", L.level).eq("lesson_num", L.num).order("id");
      var words = wr.data || [];
      if (!words.length) { pane.innerHTML = '<div class="tile"><pre style="white-space:pre-wrap;font-family:inherit;direction:auto;margin:0;line-height:1.9">' + esc(content.words || "") + "</pre></div>"; return; }
      var MB = window.KIMZA_SUPABASE.url + "/storage/v1/object/public/card-media/";
      var bar = '<div class="audiobar"><label for="wSpd">سرعة الصوت</label><select id="wSpd">' + SPEEDS.map(function (v) { return '<option value="' + v + '"' + (v === 1 ? " selected" : "") + ">" + v + "x</option>"; }).join("") + '</select><label class="wloop"><input type="checkbox" id="wLoop"> 🔁 كرّر الصوت الذي أضغط عليه حتى أضغط عليه مرة أخرى</label></div>';
      pane.innerHTML = bar + '<div class="wgrid">' + words.map(function (w, i) {
        return '<article class="wcard"><button class="wimg" type="button" data-a="' + esc(w.audio || "") + '" data-tx="' + esc(w.english) + '" data-k="w' + i + '" aria-label="استمع إلى ' + esc(w.english) + '">' +
          (w.image ? '<img src="' + esc(MB + w.image) + '" alt="" loading="lazy">' : '<span class="wnone" aria-hidden="true">🔊</span>') + '<span class="wplay" aria-hidden="true">🔊</span></button>' +
          '<div class="wtxt"><div class="wen" dir="ltr">' + esc(w.english) + '</div><div class="war">' + esc(w.arabic || "") + '</div>' +
          (w.example_en ? '<button class="wex" type="button" data-a="' + esc(w.example_audio || "") + '" data-tx="' + esc(w.example_en) + '" data-k="e' + i + '"><span class="wen2" dir="ltr">' + esc(w.example_en) + '</span><span class="war2">' + esc(w.example_ar || "") + '</span><span class="wplay2" aria-hidden="true">🔊</span></button>' : "") + "</div></article>";
      }).join("") + "</div>";
      var wSpeed = 1, wLoop = false, wKey = null, wAudio = null;
      function wStop() { wKey = null; if (wAudio) { try { wAudio.pause(); } catch (e) {} wAudio = null; } try { speechSynthesis.cancel(); } catch (e) {} pane.querySelectorAll(".playing").forEach(function (x) { x.classList.remove("playing"); }); }
      mediaStop = wStop;
      function wPlay(btn) {
        var key = btn.getAttribute("data-k");
        if (wKey === key) { wStop(); return; }
        wStop(); wKey = key; btn.classList.add("playing");
        var file = btn.getAttribute("data-a"), tx = btn.getAttribute("data-tx");
        (function run() {
          if (wKey !== key) return;
          KZ.logAct("sound", id, 1);
          function again() { if (wKey === key && wLoop) setTimeout(run, 700); else if (wKey === key) wStop(); }
          if (file) { wAudio = new Audio(MB + file); wAudio.playbackRate = wSpeed; wAudio.addEventListener("ended", again); wAudio.play().catch(function () { wStop(); }); }
          else if ("speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(tx); u.lang = "en-GB"; u.rate = Math.min(2, 0.9 * wSpeed); u.onend = again; speechSynthesis.speak(u); }
        })();
      }
      pane.querySelectorAll("[data-k]").forEach(function (b2) { b2.addEventListener("click", function () { wPlay(b2); }); });
      document.getElementById("wSpd").addEventListener("change", function (ev) { wSpeed = Number(ev.target.value); if (wAudio) wAudio.playbackRate = wSpeed; });
      document.getElementById("wLoop").addEventListener("change", function (ev) { wLoop = ev.target.checked; });
      return;
    }
    if (t === "story") {
      var h = "";
      if (L.open_story || IS_T) {
        h += '<div id="simgs" class="simgs"></div>';
        var sl = String(content.story || "").split("\n"), sh = "";
        sl.forEach(function (ln) {
          if (!ln.trim()) { sh += '<div style="height:10px"></div>'; return; }
          if (/[؀-ۿ]/.test(ln)) sh += '<div dir="rtl" style="color:#8a6d00;font-family:Tajawal,sans-serif;line-height:1.9;font-size:1.05rem;margin:0 0 4px">' + esc(ln) + "</div>";
          else sh += '<div dir="ltr" style="line-height:1.9;font-size:1.1rem;font-weight:600">' + esc(ln) + "</div>";
        });
        if (IS_T) h += '<p style="margin:8px 0"><button class="btn btn-ghost sm" id="stEdit" type="button">✎ تعديل نص القصة</button></p>';
        h += '<div class="tile story kz-copyok" id="stText">' + sh + "</div>";
      }
      h += '<div id="saudio"></div>';
      if (!IS_T && (L.open_story || L.open_audio)) h += '<div id="srep" class="tile" style="margin-top:16px"></div>';
      pane.innerHTML = h;
      if (!IS_T && document.getElementById("srep")) (async function () {
        var box = document.getElementById("srep");
        var NSTAT = { pending: "بانتظار موافقة المعلم", approved: "تمت الموافقة", rejected: "لم يُوافَق على هذا اللقب، اختر غيره" };
        var tc = 0, tt = 0, nk = null;
        async function refresh() {
          var since = new Date(); since.setHours(0, 0, 0, 0);
          var c1 = await sb.from("story_reps").select("id", { count: "exact", head: true }).gte("created_at", since.toISOString());
          var c2 = await sb.from("story_reps").select("id", { count: "exact", head: true });
          tc = c1.count || 0; tt = c2.count || 0;
          nk = (await sb.from("fluency_nicknames").select("nickname,status").maybeSingle()).data;
          draw();
        }
        function draw(msg, bad) {
          box.innerHTML = '<h3 style="margin-top:0">🔁 تكرار القصة</h3><p class="muted" style="margin-top:0">يُحسب الاستماع الكامل للقصة تلقائياً بأي سرعة. وإن أعدت قراءتها بصوتك فاضغط الزر. كلما كرّرت أكثر تحسّنت طلاقتك ولهجتك.</p>' +
            '<div class="btns"><button class="btn btn-primary" id="repBtn" type="button">🔁 كرّرتُ القصة مرة أخرى</button> <span class="muted">اليوم: <strong>' + tc + '</strong> · المجموع: <strong>' + tt + '</strong></span></div>' +
            '<p id="repMsg" class="muted" style="min-height:1.4em;' + (bad ? "color:#c62828" : "") + '">' + (msg || "") + '</p>' +
            '<details><summary class="muted" style="cursor:pointer">اللقب الخاص بي</summary><div class="form" style="margin-top:8px;max-width:360px"><div><label for="nkIn">لقب لنفسك (2 إلى 20 حرفاً)</label><input id="nkIn" maxlength="20" value="' + esc(nk ? nk.nickname : "") + '"></div>' +
            (nk ? '<p class="muted" style="margin:0">' + esc(NSTAT[nk.status] || "") + '</p>' : "") + '<div><button class="btn btn-ghost sm" id="nkBtn" type="button">حفظ اللقب</button></div></div></details>';
          document.getElementById("repBtn").addEventListener("click", async function () {
            var b = this; b.disabled = true;
            var r = await sb.rpc("log_story_rep", { p_lesson: id, p_audio_seconds: (function () { var a = document.getElementById("au"); return a && isFinite(a.duration) ? Math.round(a.duration) : null; })() });
            b.disabled = false;
            if (r.error) { draw("تعذر التسجيل. حاول لاحقاً.", true); return; }
            var d = r.data || {};
            if (d.ok) { tc = d.today; tt = d.total; draw("✅ تم تسجيل التكرار. أحسنت!"); }
            else if (d.reason === "too_soon") draw("أكمل إعادة القصة أولاً ثم سجّل التكرار (بعد " + d.wait + " ثانية).", true);
            else draw("سجّلت اليوم ما يكفي. أحسنت، عُد غداً!", false);
          });
          document.getElementById("nkBtn").addEventListener("click", async function () {
            var v = document.getElementById("nkIn").value.trim();
            var r = await sb.rpc("set_fluency_nickname", { p_name: v });
            if (r.error) { draw("تعذر حفظ اللقب. استخدم 2 إلى 20 حرفاً بدون أرقام طويلة أو روابط.", true); return; }
            await refresh();
          });
        }
        var MSGS = ["أحسنت! استمعت للقصة كاملة 🎧 كلما كررت أكثر اقترب نطقك من النطق الطبيعي.", "رائع! أنت تبني لهجة سلسة مع كل تكرار 🌟", "استمر! التكرار هو سرّ الطلاقة 💪", "ممتاز! أذنك تتعوّد على النطق الصحيح 👂", "كل مرة تسمع فيها القصة تقرّبك من لهجة إنجليزية طلقة 🚀", "جميل جداً! كرّر مرة أخرى، فكل تكرار يصنع فرقاً ✨"];
        window.__kzAutoRep = async function (secs) {

        refresh();
      })();
      if (IS_T && document.getElementById("stEdit")) document.getElementById("stEdit").addEventListener("click", function () {

        document.getElementById("stArea").value = content.story || "";
        document.getElementById("stCancel").addEventListener("click", function () { show("story"); });
        document.getElementById("stSave").addEventListener("click", async function () {
          var body = document.getElementById("stArea").value;

      if (L.open_story || IS_T) {
        // story pictures: A1-L01-story-1.jpg, -2 ... in the public lesson-images bucket (shown in order)

              if (ok) { okUrl = u; okName = id + "-story-" + n + "." + exts[q]; break; }
            }
            if (!okUrl) { misses++; continue; }
            misses = 0;
            box.insertAdjacentHTML("beforeend", '<div class="simg" style="position:relative;display:inline-block"><img src="' + esc(okUrl) + '" alt="" loading="lazy">' +
              (IS_T ? '<button class="btn danger sm" type="button" data-delimg="' + esc(okName) + '" style="position:absolute;top:8px;inset-inline-start:8px">🗑 حذف الصورة</button>' : "") + "</div>");
          }
          box.querySelectorAll("[data-delimg]").forEach(function (b) { b.addEventListener("click", async function () {
            if (!confirm("حذف هذه الصورة نهائياً؟")) return;
            var d = await KZ.removeObjects("lesson-images", [b.getAttribute("data-delimg")]);
            if (d.error) { KZ.toast("تعذر الحذف: " + d.error.message, true); return; }

        })();
      }
      var sa = document.getElementById("saudio");
      if (!L.open_audio && !IS_T) { if (!L.open_story) sa.innerHTML = locked("الصوت"); return; }
      sa.innerHTML = '<div class="tile"><p class="muted">جارٍ تحميل الصوت...</p></div>';
      var s = await sb.storage.from("lesson-audio").createSignedUrl(id + ".mp3", 3600);
      if (s.error || !s.data) { sa.innerHTML = '<div class="tile"><p class="muted">لم يرفع المعلم ملف الصوت لهذا الدرس بعد.</p></div>'; return; }
      var dl = await sb.storage.from("lesson-audio").createSignedUrl(id + ".mp3", 3600, { download: id + ".mp3" });
      sa.innerHTML = '<div class="tile"><h3>🎧 استمع إلى القصة</h3><audio id="au" controls controlsList="nodownload" preload="metadata" style="width:100%" src="' + esc(s.data.signedUrl) + '"></audio>' +
        '<div class="audiobar"><label for="auSpd">السرعة</label><select id="auSpd">' + SPEEDS.map(function (v) { return '<option value="' + v + '"' + (v === 1 ? " selected" : "") + ">" + v + "x</option>"; }).join("") + '</select>' +
        '<button class="btn btn-ghost sm" id="auLoop" type="button" aria-pressed="false">🔁 تكرار تلقائي</button>' +
        (dl.data ? '<a class="btn btn-primary sm" href="' + esc(dl.data.signedUrl) + '" download>⬇ تحميل الصوت</a>' : "") + '</div>' +
        '<p class="muted">استمع ثم أعد القصة جملة جملة. غيّر السرعة وفعّل التكرار ليعيد الصوت دون أن تضغط كل مرة.</p></div>';
      var au = document.getElementById("au");
      mediaStop = function () { try { au.pause(); } catch (e) {} };
      (function () {
        var lastT = 0, acc = 0;
        function done() {
          var d = au.duration;
          if (isFinite(d) && d > 0 && acc >= 0.8 * d) { acc = 0; if (window.__kzAutoRep) window.__kzAutoRep(d); } else acc = 0;
        }
        au.addEventListener("timeupdate", function () {
          var t = au.currentTime, d = au.duration, dt = t - lastT;
          if (dt > 0 && dt < 1.5 * Math.max(1, au.playbackRate)) acc += dt;
          else if (isFinite(d) && lastT > d * 0.85 && t < d * 0.3 && au.loop) done();   // auto-loop wrapped around
          else if (dt < 0 || dt >= 1.5 * Math.max(1, au.playbackRate)) { /* seek: the played time so far stays */ }
          lastT = t;
        });
        au.addEventListener("ended", function () { if (!au.loop) { lastT = 0; done(); } });
        au.addEventListener("seeking", function () { lastT = au.currentTime; });
      })();
      document.getElementById("auSpd").addEventListener("change", function (ev) { au.playbackRate = Number(ev.target.value); });
      au.addEventListener("play", function () { au.playbackRate = Number(document.getElementById("auSpd").value); });
      document.getElementById("auLoop").addEventListener("click", function (ev) { au.loop = !au.loop; ev.target.setAttribute("aria-pressed", String(au.loop)); ev.target.className = "btn " + (au.loop ? "btn-primary" : "btn-ghost") + " sm"; ev.target.textContent = au.loop ? "⏹ إيقاف التكرار" : "🔁 تكرار تلقائي"; });

    }
    async function fileBlobUrl(f, onp) {
      var su = await sb.storage.from("lesson-files").createSignedUrl(f.path, 600);
      if (su.error || !su.data) throw new Error(su.error ? su.error.message : "no url");
      var res = await fetch(su.data.signedUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var total = Number(res.headers.get("content-length")) || f.size || 0, got = 0, chunks = [];
      var rd = res.body && res.body.getReader ? res.body.getReader() : null;
      if (rd) { for (;;) { var r = await rd.read(); if (r.done) break; chunks.push(r.value); got += r.value.length; if (total) onp(Math.min(99, Math.round(got * 100 / total))); } }
      else chunks.push(new Uint8Array(await res.arrayBuffer()));
      return URL.createObjectURL(new Blob(chunks, { type: f.mime || "application/octet-stream" }));
    }
    if (t === "files") {
      if (!document.getElementById("fbcss")) {
        var fst = document.createElement("style"); fst.id = "fbcss";
        fst.textContent = ".fbw{position:relative}.fbsw{position:sticky;top:8px;z-index:30;display:flex;gap:4px;justify-content:center;width:max-content;max-width:100%;margin:0 auto 12px;background:rgba(11,31,68,.96);border:1px solid #D4AF37;border-radius:30px;padding:4px;box-shadow:0 6px 22px rgba(0,0,0,.35)}" +
          ".fbsw button{font:inherit;font-weight:700;border:0;background:transparent;color:#F8F4E9;border-radius:24px;padding:8px 16px;cursor:pointer;min-height:40px}.fbsw button[aria-pressed=true]{background:#D4AF37;color:#0B1F44}" +
          ".fbw:fullscreen,.fbw.fakefs{background:#0B1F44;overflow:auto;padding:10px 14px;box-sizing:border-box}.fbw.fakefs{position:fixed;inset:0;z-index:200}.fbw:fullscreen #fbBoard,.fbw.fakefs #fbBoard{height:calc(100vh - 66px)}";
        document.head.appendChild(fst);
      }
      var fbw0 = pane;
      fbw0.innerHTML = '<div class="fbw" id="fbw"><div class="fbsw"><button type="button" data-fb="files" aria-pressed="true">📁 المجلد</button>' + (IS_T ? '<button type="button" data-fb="board" aria-pressed="false">🧑‍🏫 السبورة</button>' : "") + '<button type="button" id="fbFs" title="ملء الشاشة">⛶</button></div><div id="fbFiles"></div><div id="fbBoard" hidden></div></div>';
      pane = document.getElementById("fbFiles");
      var fbw = document.getElementById("fbw"), fbBoard = document.getElementById("fbBoard"), fbInst = null;
      function fbFull(on) { fbw.classList.remove("fakefs"); if (on) { if (fbw.requestFullscreen) { fbw.requestFullscreen().catch(function () { fbw.classList.add("fakefs"); setTimeout(function () { if (fbInst) fbInst.i.setFull(true); }, 50); }); } else fbw.classList.add("fakefs"); } else { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} } setTimeout(function () { if (fbInst) { fbInst.i.setFull(on); } }, 120); }
      document.getElementById("fbFs").addEventListener("click", function () { var on = !(document.fullscreenElement === fbw || fbw.classList.contains("fakefs")); if (on) fbFull(true); else { fbw.classList.remove("fakefs"); fbFull(false); } });
      document.addEventListener("fullscreenchange", function () { if (!document.getElementById("fbw")) return; var on = document.fullscreenElement === fbw; if (fbInst) fbInst.i.setFull(on || fbw.classList.contains("fakefs")); });
      fbw.querySelectorAll("[data-fb]").forEach(function (b) { b.addEventListener("click", function () {
        var w = b.getAttribute("data-fb");
        fbw.querySelectorAll("[data-fb]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        document.getElementById("fbFiles").hidden = w !== "files"; fbBoard.hidden = w !== "board";
        if (w === "board") {
          KZ.loadBoard().then(function () {
            if (!fbInst) { fbInst = { lesson: id, i: KZBoard.mount(fbBoard, { sb: sb, lessonId: id }) }; }
            else { fbInst.i.resize(); }
            fbInst.i.setFull(document.fullscreenElement === fbw || fbw.classList.contains("fakefs"));
          });
        } else if (fbInst) { fbInst.i.flush(); }
      }); });
      pane.innerHTML = '<div class="tile"><p class="muted">جارٍ تحميل الملفات...</p></div>';
      var fr0 = await sb.from("lesson_files").select("*").eq("lesson_id", id).order("sort").order("id");
      var files = (fr0.data || []).filter(function (f) { return IS_T || f.is_open; });
      if (!files.length) { pane.innerHTML = '<div class="tile"><p class="muted">لا توجد ملفات في مجلد هذا الدرس بعد.</p></div>'; return; }
      var h2 = '<div class="fgrid">';
      files.forEach(function (f) {
        var kind = /^image\//.test(f.mime || "") ? "🖼" : /pdf/.test(f.mime || "") ? "📄" : /^audio\//.test(f.mime || "") ? "🎧" : /^video\//.test(f.mime || "") ? "🎬" : "📁";
        h2 += '<div class="fcard"><div class="ficon">' + kind + '</div><div class="fbody"><strong>' + esc(f.title) + '</strong><span class="muted">' + (f.downloadable ? "يمكن تحميله" : "للعرض فقط") + (IS_T && !f.is_open ? " · مخفي عن الطلاب" : "") + '</span></div><div class="fbtns"><button class="btn btn-primary sm" data-fv="' + f.id + '" type="button">عرض</button>' + (f.downloadable ? '<button class="btn btn-ghost sm" data-fd="' + f.id + '" type="button">⬇ تحميل</button>' : "") + "</div></div>";
      });
      h2 += '</div><div id="fview"></div>';
      pane.innerHTML = h2;
      var byId = {}; files.forEach(function (f) { byId[f.id] = f; });
      pane.querySelectorAll("[data-fv]").forEach(function (b) { b.addEventListener("click", async function () {
        var f = byId[b.getAttribute("data-fv")], box = document.getElementById("fview");
        box.innerHTML = '<div class="tile"><p class="muted">جارٍ فتح الملف...</p></div>';
        var m = f.mime || "", inner, u;
        try { u = await fileBlobUrl(f, function (p) { box.innerHTML = '<div class="tile"><p class="muted">جارٍ فتح الملف... ' + p + "%</p></div>"; }); }
        catch (er) { box.innerHTML = '<div class="tile"><p class="muted">تعذر فتح الملف: ' + esc(er.message || "") + "</p></div>"; return; }
        if (/^image\//.test(m)) inner = '<img src="' + esc(u) + '" alt="" style="max-width:100%;border-radius:14px">';
        else if (/pdf/.test(m)) inner = '<iframe class="frame" src="' + esc(u) + '#toolbar=' + (f.downloadable ? "1" : "0") + '&navpanes=0" title="' + esc(f.title) + '"></iframe>';
        else if (/^audio\//.test(m)) inner = '<audio controls ' + (f.downloadable ? "" : 'controlsList="nodownload"') + ' style="width:100%" src="' + esc(u) + '"></audio>';
        else if (/^video\//.test(m)) inner = '<video controls ' + (f.downloadable ? "" : 'controlsList="nodownload"') + ' style="width:100%;border-radius:14px" src="' + esc(u) + '"></video>';
        else inner = '<p class="muted">لا يمكن عرض هذا النوع داخل الصفحة.' + (f.downloadable ? " استخدم زر التحميل." : "") + "</p>";
        box.innerHTML = '<div class="tile" style="margin-top:14px"><h3>' + esc(f.title) + "</h3>" + inner + "</div>";
        box.scrollIntoView({ behavior: "smooth", block: "start" });
      }); });
      pane.querySelectorAll("[data-fd]").forEach(function (b) { b.addEventListener("click", async function () {
        var f = byId[b.getAttribute("data-fd")];
        KZ.toast("جارٍ التحميل...");
        try {
          var bu = await fileBlobUrl(f, function () {});
          var a = document.createElement("a"); a.href = bu; a.download = f.title.replace(/[\\/:*?"<>|]/g, "_") + "." + (f.path.split(".").pop() || "");
          document.body.appendChild(a); a.click(); a.remove(); KZ.toast("تم التحميل.");
        } catch (er) { KZ.toast("تعذر التحميل: " + (er.message || ""), true); } }); });
      return;
    }
    if (t === "exercises") {
      pane.innerHTML = '<div class="infobox">تمارين الحصة التفاعلية لهذا الدرس.</div><div class="fswrap" id="exw"><div class="fsbar"><button class="btn btn-ghost sm" type="button" data-fs="exw">⛶ ملء الشاشة</button></div><iframe class="frame" id="ex" sandbox="allow-scripts allow-same-origin allow-forms" title="Exercises"></iframe></div>';
      wireFs();
      var exf = document.getElementById("ex");
      exf.addEventListener("load", function () { try { KZ.blockCopyIn(exf.contentDocument); } catch (e) {} });
      exf.addEventListener("load", function () { autoFit(exf); });
      exf.srcdoc = withMe(content["class"] || "");
      return;
    }
    // homework: ask for confirmation before the timer starts
    var dm = /DURATION\s*=\s*(\d+)\s*\*\s*60/.exec(content.homework || ""), dmin = dm ? Number(dm[1]) : 15;
    if (IS_T || !(done && done.data)) {
      var started = IS_T ? { data: null } : await sb.from("homework_starts").select("lesson_id").eq("lesson_id", id).maybeSingle();
      if (!(started.data)) {
        var ok = await KZ.confirmBox("هل أنت جاهز للواجب؟", "<p>سيبدأ الواجب الآن، ومدته <strong>" + dmin + " دقيقة</strong>.</p><p>يبدأ العدّاد فور الضغط على «نعم، ابدأ» <strong>ولا يتوقف</strong> حتى لو خرجت من الصفحة. درجتك الأولى هي التي تُحتسب.</p>", "نعم، ابدأ الواجب", "ليس بعد");
        if (!ok) { pane.innerHTML = '<div class="tile"><h3>الواجب جاهز</h3><p class="muted">اضغط عندما تكون مستعداً. لن يبدأ العدّاد قبل ذلك.</p><p><button class="btn btn-primary" id="hwGo" type="button">ابدأ الواجب</button></p></div>'; document.getElementById("hwGo").addEventListener("click", function () { show("homework"); }); return; }
      }
    }
    var note = done && done.data
      ? '<div class="infobox">سلّمت هذا الواجب. درجتك الأولى المحتسبة: <strong>' + done.data.first_score + " / " + done.data.total + "</strong>. المحاولات التالية للتدريب فقط ولا تُحتسب.</div>"
      : '<div class="infobox">ادخل اسمك ثم أجب. <strong>درجتك الأولى هي التي تُحتسب</strong> وتُحفظ تلقائياً. <strong>المؤقت يبدأ من أول فتح للواجب ولا يتوقف</strong> حتى لو خرجت من الصفحة.</div>';
    pane.innerHTML = note + '<div class="fswrap" id="hww"><div class="fsbar"><button class="btn btn-ghost sm" type="button" data-fs="hww">⛶ ملء الشاشة</button></div><iframe class="frame" id="hw" sandbox="allow-scripts allow-same-origin allow-forms" title="Homework"></iframe></div>';
    wireFs();
    var fr = document.getElementById("hw");
    var elapsed = 0, hwHtml = content.homework || "";
    if (!IS_T && !(done && done.data)) {
      var st = await sb.rpc("start_homework", { p_lesson: id }); KZ.logAct("hw_open", id, 1);
      if (!st.error && typeof st.data === "number") elapsed = st.data;
    }
    var T0 = Date.now() - elapsed * 1000, SKEY = "kz-hw-" + KZ.user.id + "-" + id;
    // The timer starts the first time the homework is opened and keeps running, even if the student leaves the page.
    hwHtml = hwHtml.replace("clearInterval(timerId); left = DURATION;", "clearInterval(timerId); left = (window.__KZ_FIRST ? (window.__KZ_FIRST = false, Math.max(1, DURATION - Math.floor((Date.now() - window.__KZ_T0) / 1000))) : DURATION);");
    hwHtml = "<script>window.__KZ_FIRST=" + (done && done.data ? "false" : "true") + ";window.__KZ_T0=" + T0 + ";<" + "/script>" + hwHtml;
    fr.addEventListener("load", function () {

          if (!go) return;

      // keep the typed answers if the student leaves and comes back
      try {
        var d = w.document, saved = JSON.parse(localStorage.getItem(SKEY) || "{}");
        if (!(done && done.data)) {
          d.querySelectorAll("input[type=radio]").forEach(function (r) { if (saved["r:" + r.name] === r.value) r.checked = true; });
          d.querySelectorAll("input[type=text],textarea").forEach(function (t) { if (t.id && saved["t:" + t.id]) t.value = saved["t:" + t.id]; });
          var onIn = function (e) {

            if (t.type === "radio") saved["r:" + t.name] = t.value; else if (t.id) saved["t:" + t.id] = t.value;

          d.addEventListener("input", onIn); d.addEventListener("change", onIn);
        }
      } catch (e) {}
      // The homework page "sends" its result with fetch. Here we save it to the student's own record instead.
      w.fetch = async function (url, opts) {
        if (IS_T) return { ok: true };

          var p = JSON.parse(opts.body); KZ.logAct("hw_attempt", id, 1);

        } catch (e) {}
        return { ok: true };
      };
    });
    fr.addEventListener("load", function () { autoFit(fr); });
    fr.srcdoc = withMe(hwHtml);
  }
  document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-t")); }); });
  show(first);
  var qt = /[?&]tab=(w+)/.exec(location.search); if (qt && document.querySelector('.tabs button[data-t="' + qt[1] + '"]')) show(qt[1]);
})();
