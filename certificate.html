<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>الشهادة · KIMZA Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwwubr8b">
<link rel="stylesheet" href="app.css?v=mwwubr8b">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwwubr8b"></script>
<script src="portal-i18n.js?v=mwwubr8b"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function () {
  var prof = await KZ.requireAuth();
  if (!prof) return;
  KZ.shell(prof.role === "teacher" ? "admin" : "cert");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  try { var lk = document.createElement("link"); lk.rel = "stylesheet"; lk.href = "https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Playfair+Display:wght@700&display=swap"; document.head.appendChild(lk); } catch (e) {}
  var num = (new URLSearchParams(location.search).get("c") || "").trim();
  var r = await sb.from("certificates").select("number,level,issued_on,status,holder_name,title,body,hours,kind").eq("number", num).maybeSingle();
  if (!r.data) { app.innerHTML = '<h1>الشهادة غير موجودة</h1><p><a href="certificates.html">العودة</a></p>'; return; }
  var c = r.data;
  var verifyUrl = new URL("verify.html?c=" + encodeURIComponent(c.number), location.href).href;
  app.innerHTML = '<div class="cert-actions noprint"><button class="btn btn-primary" id="pr" type="button">🖨 طباعة / حفظ PDF</button><a class="btn btn-ghost" href="' + (prof.role === "teacher" ? "admin.html#certs" : "certificates.html") + '">← رجوع</a></div><p class="muted noprint" style="text-align:center;margin:0 0 6px">للحفظ كملف PDF: اضغط «طباعة»، واختر «حفظ بصيغة PDF»، ثم اجعل الاتجاه أفقياً (Landscape) وأزل الهوامش.</p>' + KZ.certHtml(c, verifyUrl);
  try { new QRCode(document.getElementById("qr"), { text: verifyUrl, width: 112, height: 112, colorDark: "#0B1F44", colorLight: "#ffffff" }); } catch (e) {}
  KZ.fitCert(); setTimeout(KZ.fitCert, 300); setTimeout(KZ.fitCert, 1200);
  document.getElementById("pr").addEventListener("click", function () { window.print(); });
})();

</script>
</body>
</html>
