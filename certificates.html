<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الشهادات · KIMZA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="app.css">

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("student");
  if (!prof) return;
  KZ.shell("cert");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var r = await sb.from("certificates").select("number,level,issued_on,status,holder_name").order("issued_on", { ascending: false });
  var rows = r.data || [];
  var html = "<h1>شهاداتي</h1>";
  var done = prof.completed_levels || [];
  html += '<p class="muted">المستويات المكتملة: ' + (done.length ? done.map(function (l) { return '<span class="badge gold">' + esc(l) + "</span>"; }).join(" ") : "لا توجد بعد") + "</p>";
  html += '<div class="tile">';
  if (!rows.length) html += '<p class="muted">ستظهر شهادتك هنا بعد أن يصدرها المعلم عند إكمالك المستوى بنجاح.</p>';
  rows.forEach(function (c) {
    html += '<div class="row"><div><strong class="en">' + esc(c.level) + '</strong> <span class="muted en">' + esc(c.number) + '</span><div class="muted">' + KZ.fmtDate(c.issued_on) + "</div></div><div>" +
      (c.status === "valid" ? '<span class="badge ok">سارية</span> <a class="btn btn-primary sm" href="certificate.html?c=' + encodeURIComponent(c.number) + '">عرض / طباعة</a>' : '<span class="badge bad">ملغاة</span>') + "</div></div>";
  });
  html += "</div>";
  app.innerHTML = html;
})();

</script>
</body>
</html>
