<script>(function(){var shown=false;function show(){if(shown||window.KZ)return;shown=true;var d=document.createElement("div");d.id="kzGuard";d.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0B1F44;color:#fff;padding:12px 16px;text-align:center;font:15px/1.6 Tahoma,Arial,sans-serif";d.innerHTML='الصفحة لا تكتمل التحميل؟ قد يكون الاتصال ضعيفاً أو متصفحك قديماً. <a href="check.html" style="color:#D4AF37;font-weight:bold">اضغط هنا لاختبار الاتصال</a>';(document.body||document.documentElement).appendChild(d)}function hide(){var e=document.getElementById("kzGuard");if(e&&e.parentNode)e.parentNode.removeChild(e)}addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT")setTimeout(show,300)},true);setTimeout(function(){show();var i=setInterval(function(){if(window.KZ){hide();clearInterval(i)}},1000)},9000)})()</script>

</head>
<body class="app">
<main class="app-main" style="max-width:440px;margin-top:6vh">
  <div class="tile" style="text-align:center">
    <img src="kimza-logo-gold.png" alt="KIMZA Academy" style="height:64px;background:#0B1F44;padding:8px 18px;border-radius:10px;margin-bottom:14px">
    <h1 style="font-size:1.6rem">تسجيل الدخول</h1>
    <form id="form" class="form" style="margin:auto;text-align:start">
      <div><label for="u">اسم المستخدم</label><input id="u" autocomplete="username" dir="ltr" required></div>
      <div><label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" dir="ltr" required></div>
      <div id="err" class="msg bad" hidden></div>
      <button class="btn btn-primary" id="btn" type="submit">دخول</button>
    </form>
    <p class="muted" style="font-size:15px">الحسابات تُنشأ من المعلم فقط. الطالب الذي نسي كلمة المرور يتواصل مع المعلم على إنستغرام.</p>
    <p><a href="reset.html">المعلم: نسيت كلمة المرور؟</a></p>
    <p><a href="index.html">العودة إلى الموقع</a></p>
    <p style="font-size:14px"><a href="check.html">🔎 لا يفتح الموقع أو لا تستطيع الدخول؟ اختبر اتصالك</a></p>
  </div></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwxe0g5o"></script>
<script src="portal-i18n.js?v=mwxe0g5o"></script>

<script>
(function () {
  var sb = KZ.sb;
  function $(id) { return document.getElementById(id); }
  async function go() {
    var u = await sb.auth.getUser();
    if (!u.data.user) return;
    var p = await sb.from("profiles").select("role").eq("id", u.data.user.id).maybeSingle();
    location.href = p.data && p.data.role === "teacher" ? "admin.html" : "dashboard.html";
  }
  sb.auth.getSession().then(function (s) { if (s.data.session) go(); });
  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var id = $("u").value.trim().toLowerCase();
    var email = id.indexOf("@") >= 0 ? id : id + KZ.DOMAIN;
    $("btn").disabled = true; $("err").hidden = true;
    var r = await sb.auth.signInWithPassword({ email: email, password: $("p").value });
    $("btn").disabled = false;
    if (r.error) { $("err").hidden = false; $("err").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة."; return; }
    go();
  });
})();

</script>
</body>
</html>
