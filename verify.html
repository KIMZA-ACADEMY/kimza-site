<script>(function(){var shown=false;function show(){if(shown||window.KZ)return;shown=true;var d=document.createElement("div");d.id="kzGuard";d.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0B1F44;color:#fff;padding:12px 16px;text-align:center;font:15px/1.6 Tahoma,Arial,sans-serif";d.innerHTML='الصفحة لا تكتمل التحميل؟ قد يكون الاتصال ضعيفاً أو متصفحك قديماً. <a href="check.html" style="color:#D4AF37;font-weight:bold">اضغط هنا لاختبار الاتصال</a>';(document.body||document.documentElement).appendChild(d)}function hide(){var e=document.getElementById("kzGuard");if(e&&e.parentNode)e.parentNode.removeChild(e)}addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT")setTimeout(show,300)},true);setTimeout(function(){show();var i=setInterval(function(){if(window.KZ){hide();clearInterval(i)}},1000)},9000)})()</script>

</head>
<body class="app">
<header class="app-nav"><div class="wrap"><a href="index.html"><img src="kimza-logo-gold.png" alt="KIMZA Academy"></a></div></header>
<main class="app-main" id="app" style="max-width:640px"></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwxe0g5o"></script>
<script src="portal-i18n.js?v=mwxe0g5o"></script>

<script>
(async function () {
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var num = (new URLSearchParams(location.search).get("c") || "").trim();
  function form(msg) {
    app.innerHTML = '<h1>التحقق من شهادة</h1><form class="form" id="f"><div><label for="n">رقم الشهادة</label><input id="n" dir="ltr" placeholder="KMZ-B1-2026-XXXXXX" value="' + esc(num) + '"></div><button class="btn btn-primary" type="submit">تحقق</button></form>' + (msg || "");
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      location.search = "?c=" + encodeURIComponent(document.getElementById("n").value.trim());
    });
  }
  if (!num) { form(""); return; }
  var r = await sb.rpc("verify_certificate", { p_number: num });
  var d = r.data;
  if (r.error || !d || !d.found) { form('<div class="warnbox" style="margin-top:16px">لم نجد شهادة بهذا الرقم. تأكد من الرقم وحاول مرة أخرى.</div>'); return; }
  var ok = d.status === "valid";
  app.innerHTML = '<h1>التحقق من شهادة</h1><div class="tile"><p><span class="badge ' + (ok ? "ok" : "bad") + '">' + (ok ? "✓ شهادة صحيحة وسارية" : "شهادة ملغاة") + "</span></p>" +
    '<div class="row"><span class="muted">اسم الحاصل عليها</span><strong>' + esc(d.holder_name) + "</strong></div>" +
    '<div class="row"><span class="muted">رقم الشهادة</span><strong class="en">' + esc(d.number) + "</strong></div>" +
    (d.title ? '<div class="row"><span class="muted">نوع الشهادة</span><strong class="en">' + esc(d.title) + "</strong></div>" : "") +
    (d.level ? '<div class="row"><span class="muted">المستوى</span><strong class="en">' + esc(d.level) + "</strong></div>" : "") +
        (d.body ? '<div class="row"><span class="muted">الوصف</span><strong dir="auto">' + esc(d.body) + "</strong></div>" : "") +
    '<div class="row"><span class="muted">تاريخ الإصدار</span><strong>' + esc(d.issued_on) + "</strong></div>" +
    '<div class="row"><span class="muted">الجهة</span><strong class="en">' + esc(d.academy) + "</strong></div></div>" +
    '<p class="muted" style="margin-top:14px">تعرض هذه الصفحة البيانات المعتمدة للتحقق فقط.</p>';
})();

</script>
</body>
</html>
