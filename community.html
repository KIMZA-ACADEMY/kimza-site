<script>
(async function () {
  var prof = await KZ.requireAuth("any");
  if (!prof) return;
  KZ.shell("community");
  var sb = KZ.sb, esc = KZ.esc, IS_T = prof.role === "teacher";
  var app = document.getElementById("app");
  var sess = (await sb.auth.getSession()).data.session, uid = sess.user.id;
  var EMOJIS = ["🙂", "😎", "🤓", "😄", "😇", "🥳", "🤠", "🦁", "🐯", "🐼", "🦊", "🐨", "🐸", "🐧", "🦉", "🦄", "🐬", "🦋", "🐢", "🐙", "🚀", "⭐", "🌙", "☀️", "🌈", "🔥", "⚡", "🌹", "🌴", "🏆", "🎨", "🎧", "⚽", "🏀", "📚", "💡", "🧠", "👑", "🛡️", "🦅", "🐎", "🐪", "🦒", "🐘", "🍉", "☕", "🎯", "🧩"];
  var COLORS = ["#D4AF37", "#e53935", "#fb8c00", "#43a047", "#1e88e5", "#8e24aa", "#ec407a", "#00acc1"];
  var STICKERS = ["👍", "❤️", "😂", "🎉", "👏", "🔥", "🙏", "😮", "🤝", "✅", "💪", "🌟"];
  var RULES = [
    "ممنوع منعاً باتاً الحديث عن السياسة أو الطوائف الدينية أو أي موضوع مثير للجدل.",
    "ممنوع استخدام أي ألفاظ بذيئة، وممنوع الإساءة لأي شخص أو شخصية، بالكلمات أو بالملصقات أو بأي طريقة.",
    "ممنوع الإزعاج، وممنوع طلب أو نشر أرقام التواصل الخاصة بالطلاب الآخرين.",
    "الاحترام المتبادل بين الجميع دائماً.",
    "أي عنصرية تعني الطرد من المجتمع ومن الأكاديمية.",
    "المعلم يراجع المحادثات، وله حذف أي رسالة وكتم أو حظر من يخالف القواعد.",
    "الهدف من المجتمع التعلّم والتشجيع وتبادل الأفكار وممارسة الإنجليزية. اكتب بالإنجليزية كلما استطعت."
  ];
  // simple client-side filter (the teacher also moderates). Normalises Arabic letters first.
  var BAD = ["كس", "زب", "عرص", "شرموط", "منيك", "قحب", "ابن الكلب", "ابن الحرام", "يلعن", "احا", "خرا", "كلب", "حمار", "تيس", "fuck", "shit", "bitch", "asshole", "dick", "cunt", "bastard"];
  var TOPIC = ["سياس", "حوثي", "الحوثيين", "اخوان", "داعش", "شيعي", "شيعة", "طائفي", "طائفة", "انتخابات", "politic", "election", "houthi", "isis", "sunni", "shia"];
  function norm(s) { return String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[إأآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه"); }
  function check(text) {
    var n = norm(text), w = " " + n.replace(/[^\p{L}\p{N}]+/gu, " ") + " ";
    for (var i = 0; i < BAD.length; i++) { var b = norm(BAD[i]); if (b.length <= 3 ? w.indexOf(" " + b + " ") >= 0 : n.indexOf(b) >= 0) return "الرسالة تحتوي كلمات غير مسموحة. راجع القواعد."; }
    for (var j = 0; j < TOPIC.length; j++) if (n.indexOf(norm(TOPIC[j])) >= 0) return "ممنوع الحديث في السياسة أو الطوائف أو المواضيع المثيرة للجدل.";
    if (/(\+?\d[\d\s\-\.]{6,}\d)/.test(text.replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })) || /[٠-٩][٠-٩\s\-]{6,}[٠-٩]/.test(text)) return "ممنوع كتابة أرقام الهواتف.";
    return "";
  }
  var prefs = (await sb.from("student_prefs").select("*").eq("user_id", uid).maybeSingle()).data || null;
  var TAB = "chat", room = null, rooms = [];
  var lvl = String(prof.level || "");
  if (IS_T) { ["A1", "A2", "B1", "B2", "C1"].forEach(function (l) { rooms.push(["L:" + l, "مجتمع " + l]); }); rooms.push(["all", "المجتمع العام"]); }
  else {
    if (lvl) rooms.push(["L:" + lvl, "مجتمع مستواي (" + lvl + ")"]);
    (prof.completed_levels || []).forEach(function (l) { if (String(l) !== lvl) rooms.push(["L:" + l, "مجتمع " + l]); });
    rooms.push(["all", "المجتمع العام (كل المستويات)"]);
  }
  // study-group rooms (the teacher makes the groups): "G:<id>"
  try {
    if (IS_T) ((await sb.from("student_groups").select("id,name").order("created_at")).data || []).forEach(function (g) { rooms.push(["G:" + g.id, "مجموعة: " + g.name]); });
    else ((await sb.from("group_members").select("group_id,student_groups(name)")).data || []).forEach(function (g) { rooms.push(["G:" + g.group_id, "👥 مجموعتي: " + (g.student_groups ? g.student_groups.name : "")]); });
  } catch (e) {}
  var realName = {};
  room = rooms[0][0];
  var subs = {}; try { ((await sb.from("room_subs").select("room")).data || []).forEach(function (r) { subs[r.room] = 1; }); } catch (e) {}
  (function () { var hm = /room=([^&]+)/.exec(location.hash); if (hm) { var want = decodeURIComponent(hm[1]); if (rooms.some(function (r) { return r[0] === want; })) room = want; } })();

  var css = document.createElement("style");
  css.textContent = ".cm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.cm-tabs button{font:inherit;font-weight:700;border:1px solid var(--line,#456);background:transparent;color:inherit;border-radius:12px;padding:8px 14px;cursor:pointer}.cm-tabs button[aria-selected=true]{background:#D4AF37;color:#0B1F44;border-color:#D4AF37}" +
    ".av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-size:24px;background:#fff;border:3px solid var(--c,#D4AF37);flex:none}.av.sm{width:30px;height:30px;font-size:17px;border-width:2px}" +
    ".cm-room{display:grid;grid-template-columns:1fr 240px;gap:12px}@media(max-width:820px){.cm-room{grid-template-columns:1fr}}" +
    ".cm-seats{display:flex;gap:10px;flex-wrap:wrap;padding:10px;border-radius:14px;background:rgba(212,175,55,.08);min-height:74px;align-items:flex-end}.seat{position:relative;text-align:center;font-size:12px;width:62px}.seat .chair{font-size:20px;display:block;margin-top:-6px}.seat .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.seat.off{opacity:.45}.seat.on .av{box-shadow:0 0 0 3px rgba(67,160,71,.55)}" +
    ".bub{position:absolute;bottom:62px;inset-inline-start:50%;transform:translateX(50%);background:#fff;color:#111;border-radius:12px;padding:5px 9px;font-size:13px;max-width:180px;width:max-content;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5;animation:pop .25s}@keyframes pop{from{transform:translateX(50%) scale(.6);opacity:0}}" +
    ".msgs{height:46vh;min-height:260px;overflow:auto;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(128,128,128,.3)}.m{display:flex;gap:8px;margin:0 0 10px;cursor:pointer}.m .bd{background:rgba(255,255,255,.08);border-radius:14px;padding:6px 12px;max-width:80%}.m .hd{font-size:12px;opacity:.85;display:flex;gap:8px;align-items:center}.m .rq{font-size:12px;border-inline-start:3px solid #D4AF37;padding:0 8px;opacity:.8;margin-bottom:3px}.m.me .bd{background:rgba(212,175,55,.22)}.m.hid .bd{opacity:.4;text-decoration:line-through}" +
    ".m .act{display:none;gap:4px}.m:hover .act{display:inline-flex}.m .act button{font-size:12px;border:0;background:rgba(0,0,0,.25);color:inherit;border-radius:8px;cursor:pointer;padding:1px 6px}" +
    ".cm-in{display:flex;gap:8px;margin-top:8px}.cm-in textarea{flex:1;font:inherit;min-height:44px;max-height:110px;border-radius:12px;padding:8px 10px;resize:vertical}.stk{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.stk button{font-size:20px;border:0;background:transparent;cursor:pointer}" +
    ".ev{display:flex;gap:12px;align-items:flex-start;padding:14px;margin:0 0 10px}.ev .ic{font-size:32px}.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:460px}.egrid button{font-size:24px;border:2px solid transparent;border-radius:12px;background:rgba(255,255,255,.08);cursor:pointer;padding:4px}.egrid button[aria-pressed=true]{border-color:#D4AF37;background:rgba(212,175,55,.25)}.csw{display:flex;gap:8px}.csw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer}.csw button[aria-pressed=true]{box-shadow:0 0 0 3px #D4AF37}";
  document.head.appendChild(css);

  function fmtTime(t) { try { return new Date(t).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
  function avatar(emoji, color, cls) { return '<span class="av ' + (cls || "") + '" style="--c:' + esc(color || "#D4AF37") + '">' + esc(emoji || "🙂") + "</span>"; }

  function render() {
    var h = '<h1>المجتمع</h1><div class="cm-tabs" role="tablist">' +
      [["chat", "💬 المجتمع"], ["events", "📅 الفعاليات"], ["me", "🙂 شخصيتي"], ["rules", "📜 القواعد"]].map(function (t) { return '<button data-t="' + t[0] + '" aria-selected="' + (TAB === t[0]) + '">' + t[1] + "</button>"; }).join("") + '</div><div id="cmBody"></div>';
    app.innerHTML = h;
    app.querySelectorAll("[data-t]").forEach(function (b) { b.addEventListener("click", function () { stopChat(); TAB = b.getAttribute("data-t"); render(); }); });
    ({ chat: viewChat, events: viewEvents, me: viewMe, rules: viewRules })[TAB]();
  }

  // ---------------- rules ----------------
  function viewRules() {
    var b = document.getElementById("cmBody");
    b.innerHTML = '<div class="tile"><h2>قواعد المجتمع</h2><ol style="line-height:2.1">' + RULES.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ol>" +
      (IS_T ? "" : (prefs && prefs.rules_ok ? '<p class="badge ok">✓ وافقت على القواعد</p>' : '<p><button class="btn btn-primary" id="okRules" type="button">قرأت القواعد وأوافق عليها</button></p>')) + "</div>";
    var ok = document.getElementById("okRules");
    if (ok) ok.addEventListener("click", async function () { var r = await savePrefs({ rules_ok: true }); if (!r.error) { KZ.toast("شكراً! يمكنك المشاركة الآن."); render(); } });
  }
  async function savePrefs(patch) {
    var row = Object.assign({}, prefs ? { nickname: prefs.nickname, emoji: prefs.emoji, color: prefs.color, show_public: prefs.show_public, rules_ok: prefs.rules_ok } : {}, patch);
    var r;
    if (prefs) r = await sb.from("student_prefs").update(Object.assign({}, patch, { updated_at: new Date().toISOString() })).eq("user_id", uid).select().maybeSingle();
    else r = await sb.from("student_prefs").insert(Object.assign({ user_id: uid }, row)).select().maybeSingle();
    if (r.error) { KZ.toast("تعذر الحفظ: " + r.error.message, true); return r; }
    prefs = r.data || Object.assign(prefs || {}, row); return r;
  }

  // ---------------- my character ----------------
  function viewMe() {
    var b = document.getElementById("cmBody"), p = prefs || { emoji: "🙂", color: "#D4AF37", nickname: "", show_public: true };
    var st = { emoji: p.emoji, color: p.color };
    b.innerHTML = '<div class="tile"><h2>شخصيتي واسمي المستعار</h2><p class="muted">هذه شخصيتك في المجتمع وفي تمارين الدروس، ويظهر اسمك المستعار بجانبها. تُحفظ في حسابك.</p>' +
      '<div style="display:flex;gap:12px;align-items:center;margin:10px 0"><span id="prev"></span></div>' +
      '<label>الاسم المستعار (2 إلى 20 حرفاً، بلا أرقام هواتف أو إساءة)</label><input id="nick" maxlength="20" value="' + esc(p.nickname || "") + '" style="max-width:300px">' +
      '<p><strong>اختر شخصيتك:</strong></p><div class="egrid" id="eg"></div><p><strong>لون الإطار:</strong></p><div class="csw" id="cs"></div>' +
      '<p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pub" ' + (p.show_public !== false ? "checked" : "") + ' style="width:auto;min-height:0"> أظهر اسمي المستعار في قائمة الأعضاء</label></p><p><button class="btn btn-primary" id="saveMe" type="button">حفظ</button></p></div>';
    function prev() { document.getElementById("prev").innerHTML = avatar(st.emoji, st.color) + ' <strong style="font-size:1.2rem">' + esc(document.getElementById("nick").value || "اسمك هنا") + "</strong>"; }
    var eg = document.getElementById("eg"); EMOJIS.forEach(function (e) { var x = document.createElement("button"); x.type = "button"; x.textContent = e; x.setAttribute("aria-pressed", String(e === st.emoji)); x.addEventListener("click", function () { st.emoji = e; eg.querySelectorAll("button").forEach(function (y) { y.setAttribute("aria-pressed", String(y === x)); }); prev(); }); eg.appendChild(x); });
    try { sb.rpc("taken_emojis").then(function (r) { var taken = (r && r.data) || []; eg.querySelectorAll("button").forEach(function (x) { if (taken.indexOf(x.textContent) >= 0 && x.textContent !== st.emoji) { x.disabled = true; x.title = "أخذه طالب آخر"; x.style.opacity = ".3"; x.style.textDecoration = "line-through"; } }); }); } catch (e) {}
    var cs = document.getElementById("cs"); COLORS.forEach(function (c) { var x = document.createElement("button"); x.type = "button"; x.style.background = c; x.setAttribute("aria-pressed", String(c === st.color)); x.addEventListener("click", function () { st.color = c; cs.querySelectorAll("button").forEach(function (y) { y.setAttribute("aria-pressed", String(y === x)); }); prev(); }); cs.appendChild(x); });
    document.getElementById("nick").addEventListener("input", prev); prev();
    document.getElementById("saveMe").addEventListener("click", async function () {
      var n = document.getElementById("nick").value.trim();
      if (n.length < 2) { KZ.toast("اكتب اسماً مستعاراً من حرفين على الأقل.", true); return; }
      var bad = check(n); if (bad) { KZ.toast(bad, true); return; }
      var r = await savePrefs({ nickname: n, emoji: st.emoji, color: st.color, show_public: document.getElementById("pub").checked });
      if (r.error) { KZ.toast(/emoji_uq|duplicate|unique/i.test(r.error.message || "") ? "هذا الإيموجي أخذه طالب آخر، اختر غيره." : "تعذر الحفظ.", true); return; }
      KZ.toast("تم حفظ شخصيتك.");
    });
  }

  // ---------------- events ----------------
  var KINDL = { book: ["📖", "قراءة كتاب"], video: ["🎬", "مشاهدة فيديو"], event: ["🎉", "فعالية"], idea: ["💡", "فكرة"] };
  async function viewEvents() {
    var b = document.getElementById("cmBody"); b.innerHTML = '<p class="muted">جارٍ التحميل...</p>';
    var r = await sb.from("events").select("*").order("starts_at", { ascending: true, nullsFirst: false }).order("id", { ascending: false });
    var list = r.data || [], h = '<div class="tile"><h2>لوحة الفعاليات</h2><p class="muted">هنا تظهر فعاليات الأكاديمية: قراءة كتاب في يوم إجازة، مشاهدة فيديو معاً، وأفكار الطلاب بعد موافقة المعلم.</p></div>';
    var shown = list.filter(function (e) { return e.status === "approved" || e.created_by === uid || IS_T; });
    if (!shown.length) h += '<div class="tile"><p class="muted">لا توجد فعاليات حالياً. تابعها هنا قريباً.</p></div>';
    shown.forEach(function (e) {
      var k = KINDL[e.kind] || KINDL.event, d = e.starts_at ? new Date(e.starts_at).toLocaleString("ar", { dateStyle: "full", timeStyle: "short" }) : "";
      h += '<div class="tile ev"><div class="ic">' + k[0] + '</div><div style="flex:1"><strong>' + esc(e.title) + '</strong> <span class="badge">' + k[1] + "</span>" +
        (e.status !== "approved" ? ' <span class="badge">' + ({ pending: "بانتظار موافقة المعلم", rejected: "مرفوضة", cancelled: "ملغاة" }[e.status] || e.status) + "</span>" : "") +
        (d ? '<div class="muted">🗓 ' + esc(d) + "</div>" : "") + (e.description ? "<p>" + esc(e.description) + "</p>" : "") +
        (e.proposer && IS_T ? '<div class="muted">اقترحه: ' + esc(e.proposer) + "</div>" : "") +
        (e.link ? '<p><a class="btn btn-primary sm" target="_blank" rel="noopener" href="' + esc(/^https?:\/\//i.test(e.link) ? e.link : "https://" + e.link) + '">افتح الرابط</a></p>' : "") + "</div>" +
        (IS_T ? '<div class="btns">' + (e.status === "pending" ? '<button class="btn btn-primary sm" data-ap="' + e.id + '" type="button">قبول</button><button class="btn btn-ghost sm" data-rj="' + e.id + '" type="button">رفض</button>' : "") + '<button class="btn danger sm" data-dl="' + e.id + '" type="button">حذف</button></div>' : (e.created_by === uid && e.status === "pending" ? '<button class="btn danger sm" data-dl="' + e.id + '" type="button">سحب</button>' : "")) + "</div>";
    });
    h += '<div class="tile"><h3>' + (IS_T ? "إضافة فعالية" : "اقترح فعالية أو فكرة") + '</h3><p class="muted">' + (IS_T ? "تظهر للجميع مباشرة." : "تظهر للجميع بعد موافقة المعلم.") + '</p><div class="form" style="max-width:520px"><label>العنوان</label><input id="evT" maxlength="120"><label>النوع</label><select id="evK">' + Object.keys(KINDL).map(function (k) { return '<option value="' + k + '">' + KINDL[k][0] + " " + KINDL[k][1] + "</option>"; }).join("") + '</select><label>الموعد (اختياري)</label><input id="evD" type="datetime-local"><label>رابط (يوتيوب أو غيره، اختياري)</label><input id="evL" dir="ltr"><label>وصف</label><textarea id="evX" rows="3"></textarea><p><button class="btn btn-primary" id="evAdd" type="button">' + (IS_T ? "نشر" : "إرسال للمعلم") + "</button></p></div></div>";
    b.innerHTML = h;
    b.querySelectorAll("[data-ap]").forEach(function (x) { x.addEventListener("click", async function () { await sb.from("events").update({ status: "approved" }).eq("id", x.getAttribute("data-ap")); viewEvents(); }); });
    b.querySelectorAll("[data-rj]").forEach(function (x) { x.addEventListener("click", async function () { await sb.from("events").update({ status: "rejected" }).eq("id", x.getAttribute("data-rj")); viewEvents(); }); });
    b.querySelectorAll("[data-dl]").forEach(function (x) { x.addEventListener("click", async function () { if (!confirm("حذف؟")) return; await sb.from("events").delete().eq("id", x.getAttribute("data-dl")); viewEvents(); }); });
    document.getElementById("evAdd").addEventListener("click", async function () {
      var t = document.getElementById("evT").value.trim(), tx = document.getElementById("evX").value.trim();
      if (t.length < 3) { KZ.toast("اكتب عنواناً واضحاً.", true); return; }
      var bad = check(t + " " + tx); if (bad) { KZ.toast(bad, true); return; }
      var d = document.getElementById("evD").value;
      var row = { title: t, kind: document.getElementById("evK").value, description: tx || null, link: document.getElementById("evL").value.trim() || null, starts_at: d ? new Date(d).toISOString() : null, status: IS_T ? "approved" : "pending", proposer: (prefs && prefs.nickname) || prof.full_name };
      var ins = await sb.from("events").insert(row);
      if (ins.error) { KZ.toast("تعذر الإرسال: " + ins.error.message, true); return; }
      KZ.toast(IS_T ? "تم النشر." : "تم الإرسال، وسيظهر بعد موافقة المعلم."); viewEvents();
    });
  }

  // ---------------- chat ----------------
  var poll = null, chan = null, lastId = 0, msgMap = {}, memberMap = {}, replyTo = null, onlineIds = {};
  function stopChat() { if (poll) { clearInterval(poll); poll = null; } if (chan) { try { sb.removeChannel(chan); } catch (e) {} chan = null; } }
  function blocked() {
    if (IS_T) return "";
    if (!prefs || !prefs.nickname) return "اختر شخصيتك واسمك المستعار أولاً من تبويب «شخصيتي».";
    if (!prefs.rules_ok) return "اقرأ القواعد ووافق عليها أولاً من تبويب «القواعد».";
    if (prefs.banned) return "تم إيقافك عن المشاركة في المجتمع.";
    return "";
  }
  async function viewChat() {
    var b = document.getElementById("cmBody"), bl = blocked();
    b.innerHTML = '<div class="form" style="max-width:360px;margin-bottom:8px"><select id="rm">' + rooms.map(function (r) { return '<option value="' + esc(r[0]) + '"' + (r[0] === room ? " selected" : "") + ">" + (subs[r[0]] ? "🔔 " : "") + esc(r[1]) + "</option>"; }).join("") + "</select><div class=\"btns\" style=\"margin-top:6px\"><button class=\"btn " + (subs[room] ? "btn-ghost" : "btn-primary") + " sm\" id=\"rsub\" type=\"button\">" + (subs[room] ? "🔕 إلغاء متابعة هذه الغرفة" : "🔔 تابع هذه الغرفة (تنبيهات)") + "</button></div></div>" +
      '<div class="cm-room"><div><div class="cm-seats" id="seats"><span class="muted">جارٍ التحميل...</span></div><div class="msgs" id="msgs" aria-live="polite"></div><div id="rq"></div>' +
      (bl ? '<div class="infobox" style="margin-top:8px">' + esc(bl) + "</div>" : (prefs && prefs.muted_until && new Date(prefs.muted_until) > new Date() ? '<div class="infobox">أنت مكتوم مؤقتاً حتى ' + esc(new Date(prefs.muted_until).toLocaleString("ar")) + "</div>" :
        '<div class="cm-in"><textarea id="mt" maxlength="500" placeholder="اكتب رسالة (بالإنجليزية إن استطعت)... ولا تنسَ القواعد 🙂"></textarea><button class="btn btn-primary" id="send" type="button">إرسال</button></div><div class="stk" id="stk"></div>')) +
      '</div><div class="tile" style="margin:0"><h3 style="margin-top:0">الأعضاء</h3><p class="muted" id="cnt"></p><div id="mem"></div></div></div>';
    document.getElementById("rm").addEventListener("change", function (e) { stopChat(); room = e.target.value; viewChat(); });
    var rs = document.getElementById("rsub");
    if (rs) rs.addEventListener("click", async function () {
      rs.disabled = true;
      var r = subs[room] ? await sb.rpc("room_unsubscribe", { p_room: room }) : await sb.rpc("room_subscribe", { p_room: room });
      if (r.error) { KZ.toast("تعذرت المتابعة.", true); rs.disabled = false; return; }
      if (subs[room]) delete subs[room]; else { subs[room] = 1; KZ.toast("تمت المتابعة 🔔 سيصلك تنبيه عند كل رسالة جديدة في هذه الغرفة. لتصلك تنبيهات والموقع مغلق فعّل «تنبيهات الجهاز» من زر الجرس."); }
      stopChat(); viewChat();
    });
    if (subs[room]) { try { sb.rpc("room_mark_read", { p_room: room }); } catch (e) {} }
    var stk = document.getElementById("stk"); if (stk) STICKERS.forEach(function (s) { var x = document.createElement("button"); x.type = "button"; x.textContent = s; x.addEventListener("click", function () { var t = document.getElementById("mt"); t.value += s; t.focus(); }); stk.appendChild(x); });
    msgMap = {}; lastId = 0; replyTo = null;
    var cnt = await sb.rpc("community_count", { p_room: room });
    var mem = await sb.rpc("community_members", { p_room: room });
    memberMap = {}; (mem.data || []).forEach(function (m) { memberMap[m.user_id] = m; });
    if (prefs && prefs.nickname) memberMap[uid] = { user_id: uid, nickname: prefs.nickname, emoji: prefs.emoji, color: prefs.color };
    document.getElementById("cnt").textContent = "عدد الطلاب في هذا المجتمع: " + (cnt.data == null ? "—" : cnt.data) + " · ظاهرون: " + Object.keys(memberMap).length;
    drawSeats(); await loadNew(true);
    poll = setInterval(function () { loadNew(false); }, 3000);
    // presence (who is online now) - optional
    try {
      chan = sb.channel("kzc-" + room, { config: { presence: { key: uid } } });
      chan.on("presence", { event: "sync" }, function () { onlineIds = chan.presenceState(); drawSeats(); });
      chan.subscribe(function (s) { if (s === "SUBSCRIBED" && prefs && prefs.nickname) chan.track({ at: Date.now() }); });
    } catch (e) {}
    var send = document.getElementById("send");
    if (send) {
      var go = async function () {
        var t = document.getElementById("mt").value.trim(); if (!t) return;
        var bad = check(t); if (bad) { KZ.toast(bad, true); return; }
        if (!IS_T && !(prefs && prefs.nickname)) { KZ.toast("اختر لقباً وشكلاً لشخصيتك أولاً من تبويب «شخصيتي». يظهر لقبك فقط، لا اسمك الحقيقي.", true); return; }
        var me = prefs || { nickname: prof.full_name, emoji: "🧑‍🏫", color: "#D4AF37" };
        var row = { room: room, user_id: uid, nickname: me.nickname || prof.full_name, emoji: me.emoji, color: me.color, body: t };
        if (replyTo) row.reply_to = replyTo;
        send.disabled = true; var r = await sb.from("community_messages").insert(row); send.disabled = false;
        if (r.error) { KZ.toast(/phone/.test(r.error.message) ? "ممنوع كتابة أرقام الهواتف." : "تعذر الإرسال: " + r.error.message, true); return; }
        document.getElementById("mt").value = ""; replyTo = null; document.getElementById("rq").innerHTML = ""; loadNew(false);
      };
      send.addEventListener("click", go);
      document.getElementById("mt").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
    }
  }
  function drawSeats() {
    var s = document.getElementById("seats"); if (!s) return;
    var ids = Object.keys(memberMap), onl = onlineIds || {};
    ids.sort(function (a, b) { return (onl[b] ? 1 : 0) - (onl[a] ? 1 : 0); });
    s.innerHTML = ids.length ? ids.map(function (id) { var m = memberMap[id]; return '<div class="seat ' + (onl[id] ? "on" : "off") + '" data-u="' + esc(id) + '">' + avatar(m.emoji, m.color) + '<span class="chair">🪑</span><span class="nm">' + esc(m.nickname) + "</span></div>"; }).join("") : '<span class="muted">لم ينضم أحد بعد. كن أول من يختار شخصيته!</span>';
    var mm = document.getElementById("mem"); if (mm) mm.innerHTML = ids.length ? ids.map(function (id) { var m = memberMap[id]; return '<div style="display:flex;gap:8px;align-items:center;margin:4px 0">' + avatar(m.emoji, m.color, "sm") + "<span>" + esc(m.nickname) + (onl[id] ? ' <span title="متصل الآن" style="color:#43a047">●</span>' : "") + "</span></div>"; }).join("") : '<span class="muted">—</span>';
  }
  async function loadNew(first) {
    var q = sb.from("community_messages").select("*").eq("room", room);
    var r = first ? await q.order("id", { ascending: false }).limit(60) : await q.gt("id", lastId).order("id", { ascending: true }).limit(100);
    if (r.error) return; var rows = r.data || []; if (first) rows.reverse();
    if (!rows.length && !first) return;
    var box = document.getElementById("msgs"); if (!box) return;
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    if (first) box.innerHTML = rows.length ? "" : '<p class="muted">لا رسائل بعد. ابدأ المحادثة! 👋</p>';
    else if (box.querySelector("p.muted")) box.innerHTML = "";
    if (IS_T) { var need = []; rows.forEach(function (m) { if (!(m.user_id in realName) && need.indexOf(m.user_id) < 0) need.push(m.user_id); }); if (need.length) { ((await sb.from("profiles").select("id,full_name").in("id", need)).data || []).forEach(function (p) { realName[p.id] = p.full_name; }); need.forEach(function (i) { if (!(i in realName)) realName[i] = ""; }); } }
    rows.forEach(function (m) {
      if (m.id > lastId) lastId = m.id; msgMap[m.id] = m;
      if (!memberMap[m.user_id]) { memberMap[m.user_id] = { user_id: m.user_id, nickname: m.nickname, emoji: m.emoji, color: m.color }; drawSeats(); }
      var rq = m.reply_to && msgMap[m.reply_to] ? '<div class="rq">↩ ' + esc(msgMap[m.reply_to].nickname) + ": " + esc(msgMap[m.reply_to].body.slice(0, 60)) + "</div>" : "";
      var d = document.createElement("div"); d.className = "m" + (m.user_id === uid ? " me" : "") + (m.hidden ? " hid" : ""); d.dataset.id = m.id;
      d.innerHTML = avatar(m.emoji, m.color) + '<div class="bd"><div class="hd"><strong>' + esc(m.nickname) + "</strong>" + (IS_T && realName[m.user_id] ? ' <small class="muted">(' + esc(realName[m.user_id]) + ")</small>" : "") + "<span>" + fmtTime(m.created_at) + '</span><span class="act">' +
        (m.user_id !== uid ? '<button data-rp="' + m.id + '" type="button">ردّ</button><button data-rt="' + m.id + '" type="button" title="إبلاغ">⚑</button>' : "") +
        (IS_T ? '<button data-hd="' + m.id + '" type="button">إخفاء</button>' + (m.user_id !== uid ? '<button data-mu="' + m.user_id + '" type="button">كتم 24س</button><button data-bn="' + m.user_id + '" type="button">حظر</button>' : "") : (m.user_id === uid ? '<button data-dm="' + m.id + '" type="button">حذف</button>' : "")) +
        "</span></div>" + rq + "<div>" + esc(m.body) + "</div></div>";
      d.addEventListener("click", function (e) { var t = e.target; if (t.tagName === "BUTTON") return; setReply(m); });
      d.querySelectorAll("[data-rp]").forEach(function (x) { x.addEventListener("click", function () { setReply(m); }); });
      d.querySelectorAll("[data-rt]").forEach(function (x) { x.addEventListener("click", async function () { var rr = await sb.from("community_reports").insert({ message_id: m.id }); KZ.toast(rr.error ? "تعذر الإبلاغ" : "تم إبلاغ المعلم، شكراً."); }); });
      d.querySelectorAll("[data-hd]").forEach(function (x) { x.addEventListener("click", async function () { await sb.from("community_messages").update({ hidden: !m.hidden }).eq("id", m.id); d.classList.toggle("hid"); m.hidden = !m.hidden; }); });
      d.querySelectorAll("[data-dm]").forEach(function (x) { x.addEventListener("click", async function () { if (!confirm("حذف رسالتك؟")) return; await sb.from("community_messages").delete().eq("id", m.id); d.remove(); }); });
      d.querySelectorAll("[data-mu]").forEach(function (x) { x.addEventListener("click", async function () { var rr = await sb.rpc("teacher_set_status", { p_user: m.user_id, p_mute_hours: 24, p_banned: null }); KZ.toast(rr.error ? "تعذر" : "تم الكتم 24 ساعة."); }); });
      d.querySelectorAll("[data-bn]").forEach(function (x) { x.addEventListener("click", async function () { if (!confirm("حظر هذا الطالب من المجتمع؟")) return; var rr = await sb.rpc("teacher_set_status", { p_user: m.user_id, p_mute_hours: null, p_banned: true }); KZ.toast(rr.error ? "تعذر" : "تم الحظر."); }); });
      box.appendChild(d);
      if (!first) bubble(m);
    });
    if (first || atBottom) box.scrollTop = box.scrollHeight;
    if (subs[room]) { try { sb.rpc("room_mark_read", { p_room: room }); } catch (e) {} }
  }
  function bubble(m) {
    var seat = document.querySelector('.seat[data-u="' + m.user_id + '"]'); if (!seat) return;
    var old = seat.querySelector(".bub"); if (old) old.remove();
    var b = document.createElement("div"); b.className = "bub"; b.textContent = m.body.length > 60 ? m.body.slice(0, 60) + "…" : m.body; seat.appendChild(b);
    setTimeout(function () { b.remove(); }, 6000);
  }
  function setReply(m) {
    if (!document.getElementById("mt")) return; replyTo = m.id;
    var r = document.getElementById("rq"); r.innerHTML = '<div class="infobox" style="margin-top:6px;display:flex;gap:8px;align-items:center"><span style="flex:1">↩ ردّ على <strong>' + esc(m.nickname) + "</strong>: " + esc(m.body.slice(0, 80)) + '</span><button class="btn btn-ghost sm" id="rqx" type="button">إلغاء</button></div>';
    document.getElementById("rqx").addEventListener("click", function () { replyTo = null; r.innerHTML = ""; });
    document.getElementById("mt").focus();
  }
  window.addEventListener("beforeunload", stopChat);
  if (!IS_T && (!prefs || !prefs.nickname)) TAB = "me";
  render();
})();

</script>
</body>
</html>
