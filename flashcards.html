<head>

<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwxe0g5o">
<link rel="stylesheet" href="app.css?v=mwxe0g5o">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
<script>(function(){var shown=false;function show(){if(shown||window.KZ)return;shown=true;var d=document.createElement("div");d.id="kzGuard";d.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0B1F44;color:#fff;padding:12px 16px;text-align:center;font:15px/1.6 Tahoma,Arial,sans-serif";d.innerHTML='الصفحة لا تكتمل التحميل؟ قد يكون الاتصال ضعيفاً أو متصفحك قديماً. <a href="check.html" style="color:#D4AF37;font-weight:bold">اضغط هنا لاختبار الاتصال</a>';(document.body||document.documentElement).appendChild(d)}function hide(){var e=document.getElementById("kzGuard");if(e&&e.parentNode)e.parentNode.removeChild(e)}addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT")setTimeout(show,300)},true);setTimeout(function(){show();var i=setInterval(function(){if(window.KZ){hide();clearInterval(i)}},1000)},9000)})()</script>

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwxe0g5o"></script>
<script src="portal-i18n.js?v=mwxe0g5o"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("student");
  if (!prof) return;
  KZ.shell("cards");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var KEY = "kz-fc-" + KZ.user.id;
  var learned = {};
  try { learned = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}

  var LV = KZ.levelsOf(prof), GR = await KZ.grants();
  var ls = await sb.from("lessons").select("id,num,level,title,is_open,open_words").order("level").order("num");
  var open = (ls.data || []).map(function (l) { return KZ.applyGrant(l, GR); }).filter(function (l) { return l.open_words; });
  if (!open.length) { app.innerHTML = '<h1>البطاقات</h1><p class="muted">لا توجد دروس مفتوحة بعد. ستظهر بطاقات كل درس عندما يفتحه المعلم.</p>'; return; }

  app.innerHTML = '<h1>بطاقات المفردات</h1><div class="form" style="max-width:420px"><div><label for="sel">الدرس</label><select id="sel"><option value="all">كل الدروس المفتوحة</option>' +
    open.map(function (l) { return '<option value="' + l.level + "|" + l.num + '">' + (LV.length > 1 ? esc(l.level) + " — " : "") + "الدرس " + l.num + (l.title ? " — " + esc(l.title) : "") + "</option>"; }).join("") +
    '</select></div><label style="font-weight:400"><input type="checkbox" id="hide" style="width:auto;min-height:0"> أخفِ البطاقات التي عرفتها</label></div><div id="deck"></div>';

  var cards = [], idx = 0, flipped = false;
  async function load() {
    var v = document.getElementById("sel").value;
    var q = sb.from("flashcards").select("id,level,lesson_num,english,arabic,example_en,example_ar").in("level", LV).order("level").order("lesson_num").order("id");
    if (v !== "all") q = q.eq("level", v.split("|")[0]).eq("lesson_num", Number(v.split("|")[1]));
    var r = await q;
    cards = r.data || [];
    if (document.getElementById("hide").checked) cards = cards.filter(function (c) { return !learned[c.id]; });
    idx = 0; flipped = false; draw();
  }
  function draw() {
    var d = document.getElementById("deck");
    if (!cards.length) { d.innerHTML = '<p class="muted" style="margin-top:20px">لا توجد بطاقات للمراجعة هنا. أحسنت!</p>'; return; }
    var c = cards[idx];
    var back = flipped
      ? '<div><div style="font-size:1.5rem;font-weight:700">' + esc(c.arabic || "") + '</div><p class="en muted" style="margin-top:14px">' + esc(c.example_en || "") + '</p><p class="muted">' + esc(c.example_ar || "") + "</p></div>"
      : '<div class="en">' + esc(c.english) + '</div>';
    d.innerHTML = '<p class="muted" style="text-align:center">' + (idx + 1) + " / " + cards.length + '</p><div class="flash"><div class="face" id="face" tabindex="0" role="button" aria-label="اقلب البطاقة">' + back + '</div></div>' +
      '<div class="btns" style="justify-content:center"><button class="btn btn-ghost sm" id="prev" type="button">السابقة</button><button class="btn btn-primary sm" id="know" type="button">عرفتها ✓</button><button class="btn btn-ghost sm" id="next" type="button">التالية</button></div>' +
      '<p class="muted" style="text-align:center;margin-top:10px">اضغط على البطاقة لتقلبها.</p>';
    document.getElementById("face").addEventListener("click", function () { flipped = !flipped; draw(); });
    document.getElementById("next").addEventListener("click", function () { idx = (idx + 1) % cards.length; flipped = false; draw(); });
    document.getElementById("prev").addEventListener("click", function () { idx = (idx - 1 + cards.length) % cards.length; flipped = false; draw(); });
    document.getElementById("know").addEventListener("click", function () {
      learned[c.id] = 1; try { localStorage.setItem(KEY, JSON.stringify(learned)); } catch (e) {}
      idx = (idx + 1) % cards.length; flipped = false; draw();
    });
  }
  document.getElementById("sel").addEventListener("change", load);
  document.getElementById("hide").addEventListener("change", load);
  load();
})();

</script>
</body>
</html>
