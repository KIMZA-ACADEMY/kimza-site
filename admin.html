<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة المعلم · KIMZA Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwwnpt35">
<link rel="stylesheet" href="app.css?v=mwwnpt35">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwwnpt35"></script>
<script src="portal-i18n.js?v=mwwnpt35"></script>
<script src="i18n.js?v=mwwnpt35"></script>
<script>
(async function () {
  var prof = await KZ.requireAuth("teacher");
  if (!prof) return;
  KZ.shell("admin");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var LEVELS = ["A1", "A2", "B1", "B2", "C1"];
  var TABS = [["students", "الطلاب"], ["lessons", "الدروس"], ["tests", "الاختبارات"], ["results", "النتائج"], ["attendance", "الحضور"], ["payments", "المدفوعات"], ["applications", "الطلبات"], ["speaking", "المحادثة"], ["certs", "الشهادات"], ["news", "الإعلانات"], ["follow", "متابعة الطلاب"], ["fluency", "الطلاقة والجهد"], ["designer", "تصميم الموقع"], ["texts", "النصوص"], ["courses", "الدورات والإعلانات"], ["features", "الميزات"], ["settings", "المستويات"]];
  var KIND = { weekly: "أسبوعي", monthly: "شهري", final: "نهاية المستوى" };
  var ST = { active: "نشط", paused: "متوقف مؤقتاً", graduated: "خريج", stopped: "موقوف" };
  var AT = { present: "حاضر", absent: "غائب", late: "متأخر", excused: "بعذر" };
  var pendingPrefill = null;

  function $(id) { return document.getElementById(id); }
  function opts(list, sel) { return list.map(function (x) { var v = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(v) + '"' + (v === sel ? " selected" : "") + ">" + esc(t) + "</option>"; }).join(""); }
  function genPw() { var a = "abcdefghjkmnpqrstuvwxyz23456789", s = ""; var r = new Uint32Array(10); crypto.getRandomValues(r); for (var i = 0; i < 10; i++) s += a[r[i] % a.length]; return s; }
  function genUser() { var a = "abcdefghjkmnpqrstuvwxyz23456789", s = "kz."; var r = new Uint32Array(5); crypto.getRandomValues(r); for (var i = 0; i < 5; i++) s += a[r[i] % a.length]; return s; }
  async function fn(payload) {
    var s = await sb.auth.getSession();
    var res = await fetch(window.KIMZA_SUPABASE.url + "/functions/v1/admin-users", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.data.session.access_token, apikey: window.KIMZA_SUPABASE.publishableKey },
      body: JSON.stringify(payload)
    });
    var j = {}; try { j = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(j.error || "failed");
    return j;
  }
  function copy(text) { try { navigator.clipboard.writeText(text); KZ.toast("تم النسخ."); } catch (e) { KZ.toast("تعذر النسخ، انسخ يدوياً.", true); } }
  async function nameMap() {
    var r = await sb.from("profiles").select("id,full_name,username,level,status,role,completed_levels,vote_levels").eq("role", "student").order("full_name");
    var m = {}; (r.data || []).forEach(function (p) { m[p.id] = p; }); return { list: r.data || [], map: m };
  }

  // ----- shell with tabs -----
  app.innerHTML = '<h1>لوحة المعلم</h1><div class="tabs" role="tablist" id="tabs">' +
    TABS.map(function (t) { return '<button data-tab="' + t[0] + '" aria-selected="false">' + t[1] + "</button>"; }).join("") + '</div><div id="view"></div>';
  var view = $("view");
  var VIEWS = {};
  function go(name) {
    if (!VIEWS[name]) name = "students";
    location.hash = name;
    document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false"); });
    view.innerHTML = '<p class="muted">جارٍ التحميل...</p>';
    VIEWS[name]().catch(function (e) { view.innerHTML = '<div class="warnbox">حدث خطأ في تحميل هذا القسم.</div>'; console.error(e); });
  }
  document.querySelectorAll("#tabs button").forEach(function (b) { b.addEventListener("click", function () { go(b.getAttribute("data-tab")); }); });

  // ----- per-student access: extra levels + lessons opened for this student only -----
  async function accessDialog(p) {
    var old = document.getElementById("acDlg"); if (old) old.remove();
    var ov = document.createElement("div"); ov.id = "acDlg";
    ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
    var extra = (p.completed_levels || []).slice();
    var grants = {}; ((await sb.from("lesson_grants").select("lesson_id").eq("user_id", p.id)).data || []).forEach(function (g) { grants[g.lesson_id] = 1; });
    var gl = LEVELS[0];
    ov.innerHTML = '<div class="tile" style="max-width:560px;width:100%;max-height:88vh;overflow:auto;background:var(--paper,#fff)" role="dialog" aria-label="مستويات ودروس الطالب"><h2 style="margin-top:0">' + esc(p.full_name) + '</h2>' +
      '<h3>المستويات التي يدرسها</h3><p class="muted">مستواه الأساسي ' + esc(p.level) + ' (يتغير من الجدول). اختر المستويات الإضافية:</p><div id="acLv" style="display:flex;gap:14px;flex-wrap:wrap"></div>' +
      '<h3 style="margin-top:20px">التصويت على مواعيد الحصص</h3><p class="muted">اختر المستويات التي يمثّلها في التصويت. يصوّت لكل مستوى على حدة. إن لم تختر شيئاً يصوّت لمستواه الأساسي فقط.</p><div id="acVt" style="display:flex;gap:14px;flex-wrap:wrap"></div>' +
      '<h3 style="margin-top:20px">دروس مفتوحة له وحده</h3><p class="muted">الدرس يفتح له بكل أجزائه حتى لو كان مغلقاً على بقية الطلاب.</p>' +
      '<div class="form"><div><label for="acL">المستوى</label><select id="acL">' + opts(LEVELS, gl) + '</select></div></div><div id="acList" style="margin-top:10px"></div>' +
      '<div class="btns" style="margin-top:16px"><button class="btn btn-primary" id="acX" type="button">إغلاق</button></div></div>';
    document.body.appendChild(ov);
    $("acX").addEventListener("click", function () { ov.remove(); VIEWS.students(); });
    ov.addEventListener("click", function (e) { if (e.target === ov) { ov.remove(); VIEWS.students(); } });
    function drawLv() {
      $("acLv").innerHTML = LEVELS.map(function (lv) {
        var main = lv === p.level;
        return '<label style="font-weight:400"><input type="checkbox" data-lv="' + lv + '"' + (main || extra.indexOf(lv) >= 0 ? " checked" : "") + (main ? " disabled" : "") + ' style="width:auto;min-height:0"> ' + lv + "</label>";
      }).join("");
      $("acLv").querySelectorAll("input").forEach(function (c) { c.addEventListener("change", async function () {
        var lv = c.getAttribute("data-lv"), i = extra.indexOf(lv);
        if (c.checked && i < 0) extra.push(lv); if (!c.checked && i >= 0) extra.splice(i, 1);
        var r = await sb.from("profiles").update({ completed_levels: extra }).eq("id", p.id);
        if (r.error) { KZ.toast("تعذر الحفظ.", true); } else { p.completed_levels = extra.slice(); KZ.toast("تم الحفظ."); if (typeof drawVt === "function") drawVt(); }
      }); });
    }
    var vl = (p.vote_levels || []).slice();
    function drawVt() {
      var set = [p.level].concat(extra).filter(function (x, i, arr) { return arr.indexOf(x) === i; }).sort();
      $("acVt").innerHTML = set.map(function (lv) {
        var on = vl.length ? vl.indexOf(lv) >= 0 : lv === p.level;
        return '<label style="font-weight:400"><input type="checkbox" data-vt="' + lv + '"' + (on ? " checked" : "") + ' style="width:auto;min-height:0"> ' + lv + "</label>";
      }).join("");
      $("acVt").querySelectorAll("input").forEach(function (c) { c.addEventListener("change", async function () {
        var cur = vl.length ? vl.slice() : [p.level], lv = c.getAttribute("data-vt"), i = cur.indexOf(lv);
        if (c.checked && i < 0) cur.push(lv); if (!c.checked && i >= 0) cur.splice(i, 1);
        if (!cur.length) { c.checked = true; KZ.toast("يجب أن يمثّل مستوى واحداً على الأقل.", true); return; }
        var save = (cur.length === 1 && cur[0] === p.level) ? [] : cur.sort();
        var r = await sb.from("profiles").update({ vote_levels: save }).eq("id", p.id);
        if (r.error) { KZ.toast("تعذر الحفظ.", true); c.checked = !c.checked; } else { vl = save; p.vote_levels = save; KZ.toast("تم الحفظ."); }
      }); });
    }
    async function drawLs() {
      var lv = $("acL").value;
      var ls = (await sb.from("lessons").select("id,num,title").eq("level", lv).order("num")).data || [];
      $("acList").innerHTML = ls.map(function (l) {
        return '<label style="font-weight:400;display:block;padding:3px 0"><input type="checkbox" data-ls="' + esc(l.id) + '"' + (grants[l.id] ? " checked" : "") + ' style="width:auto;min-height:0"> الدرس ' + l.num + (l.title ? " — " + esc(l.title) : "") + "</label>";
      }).join("") || '<p class="muted">لا توجد دروس.</p>';
      $("acList").querySelectorAll("input").forEach(function (c) { c.addEventListener("change", async function () {
        var id = c.getAttribute("data-ls"), r;
        if (c.checked) { r = await sb.from("lesson_grants").insert({ user_id: p.id, lesson_id: id }); if (!r.error) grants[id] = 1; }
        else { r = await sb.from("lesson_grants").delete().eq("user_id", p.id).eq("lesson_id", id); if (!r.error) delete grants[id]; }
        KZ.toast(r.error ? "تعذر الحفظ." : (c.checked ? "فُتح الدرس له." : "أُغلق الدرس عنه."), !!r.error);
        if (r.error) c.checked = !c.checked;
      }); });
    }
    drawLv(); drawVt(); $("acL").addEventListener("change", drawLs); drawLs();
  }

  // ================= Students =================
  VIEWS.students = async function () {
    var nm = await nameMap();
    var abs = {};
    (await sb.from("attendance").select("user_id").eq("status", "absent")).data.forEach(function (a) { abs[a.user_id] = (abs[a.user_id] || 0) + 1; });
    var pf = pendingPrefill || {}; pendingPrefill = null;
    var h = '<div class="cards"><form class="tile form" id="addOne"><h3>إضافة طالب</h3>' +
      '<div><label for="aName">الاسم الكامل</label><input id="aName" required maxlength="120" value="' + esc(pf.name || "") + '"></div>' +
      '<div><label for="aUser">اسم المستخدم (حروف إنجليزية)</label><input id="aUser" dir="ltr" required value="' + esc(genUser()) + '"></div>' +
      '<div><label for="aLevel">المستوى</label><select id="aLevel">' + opts(LEVELS, pf.level || "A1") + "</select></div>" +
      '<div><label for="aIg">إنستغرام (اختياري)</label><input id="aIg" dir="ltr" value="' + esc(pf.ig || "") + '"></div>' +
      '<div><label for="aPw">كلمة مرور مؤقتة</label><input id="aPw" dir="ltr" value="' + genPw() + '"></div>' +
      '<div><button class="btn btn-primary" type="submit">إنشاء الحساب</button></div></form>' +
      '<form class="tile form" id="addMany"><h3>إضافة عدة طلاب</h3><p class="muted">سطر لكل طالب: الاسم، المستوى. مثال: أحمد علي، A1</p>' +
      '<textarea id="bulk" rows="6" placeholder="أحمد علي, A1&#10;سارة محمد, B1"></textarea><div><button class="btn btn-primary" type="submit">إنشاء الحسابات</button></div></form></div>' +
      '<div id="creds"></div>';
    h += '<h2 style="margin-top:24px">الطلاب (' + nm.list.length + ')</h2><div class="tile tablewrap"><table class="t"><thead><tr><th>الاسم</th><th>المستخدم</th><th>المستوى</th><th>الحالة</th><th>مستويات إضافية</th><th>غياب</th><th></th></tr></thead><tbody>';
    nm.list.forEach(function (p) {
      h += '<tr><td>' + esc(p.full_name) + '</td><td class="en">' + esc(p.username || "") + '</td>' +
        '<td><select data-lv="' + p.id + '">' + opts(LEVELS, p.level) + '</select></td>' +
        '<td><select data-st="' + p.id + '">' + opts(Object.keys(ST).map(function (k) { return [k, ST[k]]; }), p.status) + '</select></td>' +
        '<td class="en">' + ((p.completed_levels || []).join(" ") || "—") + '</td><td>' + (abs[p.id] || 0) + (abs[p.id] > 3 ? ' <span class="badge bad">!</span>' : "") + '</td>' +
        '<td><button class="btn btn-ghost sm" data-ac="' + p.id + '" type="button">المستويات والدروس</button> <button class="btn btn-ghost sm" data-rs="' + p.id + '" type="button">كلمة مرور جديدة</button> <button class="btn danger sm" data-del="' + p.id + '" type="button">حذف</button></td></tr>';
    });
    h += "</tbody></table></div>";
    view.innerHTML = h;

    function showCreds(rows) {
      var txt = rows.map(function (r) { return r.name + " | " + r.user + " | " + r.pw; }).join("\n");
      $("creds").innerHTML = '<div class="infobox"><strong>بيانات الدخول (تظهر مرة واحدة، أعطها للطلاب)</strong><pre class="en" style="white-space:pre-wrap;direction:ltr;text-align:left;margin:8px 0">' + esc(txt) + '</pre><button class="btn btn-primary sm" id="cp" type="button">نسخ</button></div>';
      $("cp").addEventListener("click", function () { copy(txt); });
    }
    $("addOne").addEventListener("submit", async function (e) {
      e.preventDefault();
      var row = { name: $("aName").value.trim(), user: $("aUser").value.trim().toLowerCase(), pw: $("aPw").value };
      try {
        await fn({ action: "create", full_name: row.name, username: row.user, password: row.pw, level: $("aLevel").value, instagram: $("aIg").value.trim() });
        showCreds([row]); KZ.toast("تم إنشاء الحساب.");
        var keep = $("creds").innerHTML; await VIEWS.students(); $("creds").innerHTML = keep; $("cp") && $("cp").addEventListener("click", function () { copy(row.name + " | " + row.user + " | " + row.pw); });
      } catch (er) { KZ.toast("تعذر إنشاء الحساب: " + er.message, true); }
    });
    $("addMany").addEventListener("submit", async function (e) {
      e.preventDefault();
      var lines = $("bulk").value.split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean);
      var done = [], failed = [];
      for (var i = 0; i < lines.length; i++) {
        var parts = lines[i].split(/[,،;|]/).map(function (x) { return x.trim(); });
        var lvl = (parts[1] || "A1").toUpperCase();
        var row = { name: parts[0], user: genUser(), pw: genPw() };
        try { await fn({ action: "create", full_name: row.name, username: row.user, password: row.pw, level: LEVELS.indexOf(lvl) >= 0 ? lvl : "A1" }); done.push(row); }
        catch (er) { failed.push(parts[0] + " (" + er.message + ")"); }
      }
      await VIEWS.students(); showCreds(done);
      if (failed.length) KZ.toast("فشل: " + failed.join("، "), true); else KZ.toast("تم إنشاء " + done.length + " حساباً.");
    });
    view.querySelectorAll("[data-lv]").forEach(function (s) { s.addEventListener("change", async function () {
      var r = await sb.from("profiles").update({ level: s.value }).eq("id", s.getAttribute("data-lv")); KZ.toast(r.error ? "تعذر الحفظ." : "تم تغيير المستوى.", !!r.error); }); });
    view.querySelectorAll("[data-st]").forEach(function (s) { s.addEventListener("change", async function () {
      var r = await sb.from("profiles").update({ status: s.value }).eq("id", s.getAttribute("data-st")); KZ.toast(r.error ? "تعذر الحفظ." : "تم تغيير الحالة.", !!r.error); }); });
    view.querySelectorAll("[data-ac]").forEach(function (b) { b.addEventListener("click", function () { accessDialog(nm.map[b.getAttribute("data-ac")]); }); });
    view.querySelectorAll("[data-rs]").forEach(function (b) { b.addEventListener("click", async function () {
      var id = b.getAttribute("data-rs"), pw = genPw(), p = nm.map[id];
      try { await fn({ action: "reset_password", user_id: id, password: pw }); showCreds([{ name: p.full_name, user: p.username, pw: pw }]); } catch (er) { KZ.toast("تعذر التغيير.", true); } }); });
    view.querySelectorAll("[data-del]").forEach(function (b) { b.addEventListener("click", async function () {
      var id = b.getAttribute("data-del"), p = nm.map[id];
      if (!confirm("حذف حساب " + p.full_name + " نهائياً مع كل بياناته؟ لا يمكن التراجع.")) return;
      try { await fn({ action: "delete", user_id: id }); KZ.toast("تم الحذف."); VIEWS.students(); } catch (er) { KZ.toast("تعذر الحذف.", true); } }); });
  };

  // ================= Lessons: open or lock every part of every lesson =================
  var lessonLevel = "A1";
  var TABL = [["words", "الكلمات"], ["story", "القصة والصوت"], ["exercises", "التمارين"], ["homework", "الواجب"], ["files", "المجلد"]];
  var PARTS = [["words", "الكلمات"], ["story", "القصة"], ["audio", "الصوت"], ["exercises", "التمارين"], ["homework", "الواجب"]];
  VIEWS.lessons = async function () {
    var r = await sb.from("lessons").select("id,num,title,open_words,open_story,open_audio,open_exercises,open_homework,hidden_tabs").eq("level", lessonLevel).order("num");
    var ls = r.data || [];
    var audioSet = {}, imgSet = {}, fileCnt = {};
    try { ((await sb.from("lesson_files").select("lesson_id")).data || []).forEach(function (o) { fileCnt[o.lesson_id] = (fileCnt[o.lesson_id] || 0) + 1; }); } catch (e) {}
    try { ((await sb.storage.from("lesson-audio").list("", { limit: 1000 })).data || []).forEach(function (o) { audioSet[o.name] = true; }); } catch (e) {}
    try { ((await sb.storage.from("lesson-images").list("", { limit: 1000 })).data || []).forEach(function (o) { var m = /^(.*)-story-d+./.exec(o.name); if (m) { (imgSet[m[1]] = imgSet[m[1]] || []).push(o.name); } }); } catch (e) {}
    var h = '<div class="form" style="max-width:240px"><label for="lv">المستوى</label><select id="lv">' + opts(LEVELS, lessonLevel) + "</select></div>";
    h += '<div class="tile" style="margin:12px 0"><strong>إظهار أو إخفاء الأزرار (التبويبات) عن الطلاب في كل دروس ' + lessonLevel + ':</strong><div class="btns" style="margin-top:8px">';
    TABL.forEach(function (t) { var allHid = ls.length && ls.every(function (l) { return (l.hidden_tabs || []).indexOf(t[0]) >= 0; });
      h += '<button class="btn ' + (allHid ? "btn-ghost" : "btn-primary") + ' sm" data-htall="' + t[0] + "|" + (allHid ? "0" : "1") + '" type="button">' + (allHid ? "🚫 " : "✓ ") + t[1] + "</button>"; });
    h += "</div><p class=\"muted\" style=\"margin:8px 0 0\">الأزرق = ظاهر للطلاب، الرمادي = مخفي. يمكنك أيضاً التحكم في كل درس على حدة أسفل.</p></div>";
    h += '<p class="muted">تحكّم في كل جزء من كل درس على حدة: الكلمات، القصة، الصوت، التمارين (صفحة الحصة التفاعلية)، والواجب. الأجزاء المقفلة تظهر للطالب بقفل.</p>';
    var weeks = {}; ls.forEach(function (l) { var w = Math.ceil(l.num / 4); (weeks[w] = weeks[w] || []).push(l); });
    Object.keys(weeks).forEach(function (w) {
      h += '<div class="tile" style="margin:12px 0"><div class="row" style="padding-top:0"><h3 style="margin:0">الأسبوع ' + w + '</h3><div class="btns">';
      PARTS.forEach(function (p) {
        var all = weeks[w].every(function (l) { return l["open_" + p[0]]; });
        h += '<button class="btn btn-ghost sm" data-wk="' + w + '|' + p[0] + '|' + (all ? "0" : "1") + '" type="button">' + (all ? "إغلاق " : "فتح ") + p[1] + "</button>";
      });
      h += "</div></div>";
      weeks[w].forEach(function (l) {
        h += '<div class="row" style="align-items:flex-start"><div><strong>الدرس ' + l.num + '</strong> <span class="muted en">' + esc(l.title || "") + '</span><div class="btns" style="margin-top:8px">';
        PARTS.forEach(function (p) {
          var on = l["open_" + p[0]];

    view.querySelectorAll("[data-bf]").forEach(function (f) { f.addEventListener("submit", async function (e) {
      e.preventDefault(); var el = f.elements, id = Number(f.getAttribute("data-bf"));
      var style = { bg: el.bg.value, bgc: el.bgc.value, align: el.align.value, imgPos: el.imgPos.value, size: el.size.value, radius: el.radius.value, width: el.width.value, badge: el.badge.value.trim() };
      var r2 = await sb.from("site_blocks").update({ title: el.title.value.trim() || null, body: el.body.value.trim() || null, image_url: el.image_url.value || null, cta_type: el.cta_type.value, cta_label: el.cta_label.value.trim() || null, cta_url: el.cta_url.value.trim() || null, style: style }).eq("id", id);
      KZ.toast(r2.error ? "تعذر الحفظ." : "تم الحفظ.", !!r2.error); if (!r2.error) VIEWS.designer(); }); });
  };

  // ================= Editable texts =================
  var txQ = "", txShown = 40;
  VIEWS.texts = async function () {
    var D = window.I18N || { ar: {}, en: {} };
    var ov = {}; ((await sb.from("site_texts").select("*")).data || []).forEach(function (x) { ov[x.key] = x; });
    var keys = Object.keys(D.ar || {}).filter(function (k) { return !/^(a11y|js)\./.test(k) && !/^title\./.test(k); });
    var q = txQ.trim().toLowerCase();
    var list = keys.filter(function (k) { return !q || k.toLowerCase().indexOf(q) >= 0 || String((ov[k] && ov[k].ar) || D.ar[k]).toLowerCase().indexOf(q) >= 0 || String((ov[k] && ov[k].en) || D.en[k] || "").toLowerCase().indexOf(q) >= 0; });
    var h = '<p class="muted">غيّر أي نص في الصفحات العامة للموقع: ابحث عنه، عدّله بالعربية أو الإنجليزية، واضغط «حفظ». لا تحذف الوسوم مثل &lt;span&gt; إن وُجدت داخل النص. «استرجاع» يعيد النص الأصلي.</p>';
    h += '<div class="tile form" style="max-width:520px"><label>بحث في النصوص</label><input id="txQ" value="' + esc(txQ) + '" placeholder="اكتب جزءاً من النص"></div>';
    h += '<p class="muted">' + list.length + " نصاً" + (list.length > txShown ? " (يُعرض أول " + txShown + ")" : "") + "</p>";
    list.slice(0, txShown).forEach(function (k) {
      var o = ov[k] || {};
      h += '<div class="tile" style="margin-bottom:10px"><div class="muted en" style="font-size:.8rem">' + esc(k) + (ov[k] ? ' · <span class="badge gold">معدّل</span>' : "") + '</div><div class="form" style="margin-top:6px"><div><label>العربية</label><textarea data-tk="' + esc(k) + '" data-l="ar" rows="2">' + esc(o.ar != null ? o.ar : D.ar[k]) + '</textarea></div><div><label>English</label><textarea data-tk="' + esc(k) + '" data-l="en" rows="2" dir="ltr">' + esc(o.en != null ? o.en : (D.en[k] || "")) + '</textarea></div><div class="btns"><button class="btn btn-primary sm" data-ts="' + esc(k) + '" type="button">حفظ</button>' + (ov[k] ? '<button class="btn btn-ghost sm" data-tr="' + esc(k) + '" type="button">استرجاع الأصل</button>' : "") + "</div></div></div>";
    });
    if (list.length > txShown) h += '<p><button class="btn btn-ghost" id="txMore" type="button">عرض المزيد</button></p>';
    view.innerHTML = h;
    var t = $("txQ"); t.addEventListener("change", function () { txQ = t.value; txShown = 40; VIEWS.texts(); });
    var m = $("txMore"); if (m) m.addEventListener("click", function () { txShown += 60; VIEWS.texts(); });
    view.querySelectorAll("[data-ts]").forEach(function (b) { b.addEventListener("click", async function () {
      var k = b.getAttribute("data-ts"), ar = view.querySelector('[data-tk="' + k + '"][data-l="ar"]').value, en = view.querySelector('[data-tk="' + k + '"][data-l="en"]').value;
      var r2 = await sb.from("site_texts").upsert({ key: k, ar: ar, en: en, updated_at: new Date().toISOString() });
      KZ.toast(r2.error ? "تعذر الحفظ." : "تم الحفظ. يظهر في الموقع فوراً.", !!r2.error); if (!r2.error) VIEWS.texts(); }); });
    view.querySelectorAll("[data-tr]").forEach(function (b) { b.addEventListener("click", async function () { await sb.from("site_texts").delete().eq("key", b.getAttribute("data-tr")); VIEWS.texts(); }); });
  };

  // ================= Student follow-up: results, support needs, time on the site =================
  var fwLevel = "A1", fwMode = "sum", fwOnly = false;
  function fmtT(sec) { sec = Math.round(sec || 0); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return h ? h + " س " + m + " د" : m + " د"; }
  function band(p) {
    if (p == null) return { c: "p-no", t: "لا بيانات" };
    if (p >= 85) return { c: "p-ex", t: "ممتاز" };
    if (p >= 70) return { c: "p-gd", t: "جيد" };
    if (p >= 50) return { c: "p-md", t: "متوسط" };
    return { c: "p-lo", t: "يحتاج دعماً" };
  }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function cell(p) { var b = band(p); return '<td class="pc ' + b.c + '">' + (p == null ? "—" : Math.round(p) + "%") + "</td>"; }
  VIEWS.follow = async function () {
    view.innerHTML = '<p class="muted">جارٍ تحميل البيانات...</p>';
    var res = await Promise.all([
      sb.from("profiles").select("id,full_name,level,status,role").eq("role", "student").eq("level", fwLevel).order("full_name"),
      sb.from("lessons").select("id,level,num,open_homework").eq("level", fwLevel).order("num"),
      sb.from("homework_submissions").select("*"),
      sb.from("tests").select("id,kind,level").eq("level", fwLevel),
      sb.from("test_attempts").select("*"),
      sb.from("attendance").select("*"),
      sb.from("study_time").select("*"),
      sb.from("card_progress").select("user_id,state"),
    ]);
    var students = res[0].data || [], lessons = res[1].data || [], hw = res[2].data || [], tests = res[3].data || [];
    var attempts = res[4].data || [], attendance = res[5].data || [], time = res[6].data || [], cards = res[7].data || [];
    var lessonIds = {}; lessons.forEach(function (l) { lessonIds[l.id] = l; });
    var testIds = {}; tests.forEach(function (t) { testIds[t.id] = t; });
    var weekAgo = Date.now() - 7 * 86400000;
    var info = students.map(function (s) {
      var mine = hw.filter(function (x) { return x.user_id === s.id && lessonIds[x.lesson_id]; });
      var pcts = mine.map(function (x) { return x.total ? x.first_score / x.total * 100 : 0; });
      var tAtt = attempts.filter(function (x) { return x.user_id === s.id && testIds[x.test_id] && x.submitted_at; });
      var tp = tAtt.map(function (x) { return x.total ? x.score / x.total * 100 : 0; });
      var hwAvg = avg(pcts), tAvg = avg(tp);
      var comp = hwAvg != null && tAvg != null ? hwAvg * 0.6 + tAvg * 0.4 : (hwAvg != null ? hwAvg : tAvg);
      var open = lessons.filter(function (l) { return l.open_homework; }).length;
      var abs = attendance.filter(function (a) { return a.user_id === s.id && a.status === "absent"; }).length;
      var myTime = time.filter(function (x) { return x.user_id === s.id; });
      var total = myTime.reduce(function (q, x) { return q + x.seconds; }, 0);
      var wk = myTime.filter(function (x) { return new Date(x.day).getTime() >= weekAgo; }).reduce(function (q, x) { return q + x.seconds; }, 0);
      var last = myTime.reduce(function (m, x) { return !m || x.last_seen > m ? x.last_seen : m; }, null);
      var myCards = cards.filter(function (c) { return c.user_id === s.id; });
      var miss = {}; mine.forEach(function (x) { ((x.answers && x.answers.mistakes) || []).forEach(function (m) { var k = (m.q || "").slice(0, 70); if (k) miss[k] = (miss[k] || 0) + 1; }); });
      var weak = Object.keys(miss).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 3);
      var missing = Math.max(0, open - mine.length), notes = [];
      if (missing >= 2) notes.push("لم يسلّم " + missing + " واجبات");
      if (abs > 3) notes.push("غيابه " + abs);
      if (open && wk < 1800) notes.push("وقته على الموقع قليل هذا الأسبوع");
      if (comp != null && comp < 45 && mine.length >= 3) notes.push("فكّر بنقله إلى مستوى أدنى");
      if (comp != null && comp >= 90 && mine.length >= 5) notes.push("مستعد لمستوى أعلى");
      if (comp != null && comp < 70 && weak.length) notes.push("يحتاج مراجعة: " + weak[0]);
      return { s: s, mine: mine, hwAvg: hwAvg, tAvg: tAvg, comp: comp, open: open, abs: abs, total: total, wk: wk, last: last, learned: myCards.filter(function (c) { return c.state === "review"; }).length, seen: myCards.length, tAtt: tAtt, notes: notes, weak: weak, missing: missing };
    });
    var h = '<div class="tile form" style="max-width:none"><div class="btns" style="align-items:flex-end"><div><label>المستوى</label><select id="fwL">' + opts(LEVELS, fwLevel) + '</select></div><div><label>العرض</label><select id="fwM">' + opts([["sum", "الملخص والدعم"], ["lesson", "لكل درس"], ["week", "لكل أسبوع"], ["month", "لكل شهر"], ["tests", "الاختبارات"]], fwMode) + '</select></div><label style="display:inline-flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" id="fwO"' + (fwOnly ? " checked" : "") + ' style="width:auto;min-height:0"> أظهر من يحتاج دعماً فقط</label></div></div>';
    h += '<div class="legend"><span class="pc p-ex">ممتاز 85%+</span><span class="pc p-gd">جيد 70–84%</span><span class="pc p-md">متوسط 50–69%</span><span class="pc p-lo">يحتاج دعماً أقل من 50%</span><span class="pc p-no">لا بيانات</span></div>';
    var shown = info.filter(function (x) { return !fwOnly || (x.comp != null && x.comp < 70) || x.notes.length; });
    if (!shown.length) h += '<p class="muted">لا يوجد طلاب في هذا المستوى بهذا الشرط.</p>';
    else if (fwMode === "sum") {
      h += '<div class="tile tablewrap"><table class="t"><thead><tr><th>الطالب</th><th>الأداء</th><th>الواجبات</th><th>الاختبارات</th><th>الغياب</th><th>الكلمات</th><th>الوقت على الموقع</th><th>آخر نشاط</th><th>ملاحظات وما يحتاجه</th></tr></thead><tbody>';
      shown.sort(function (a, b) { return (a.comp == null ? 999 : a.comp) - (b.comp == null ? 999 : b.comp); }).forEach(function (x) {
        var b = band(x.comp);
        h += "<tr><td><strong>" + esc(x.s.full_name) + '</strong><div class="muted en">' + esc(x.s.level) + "</div></td>" + '<td class="pc ' + b.c + '">' + (x.comp == null ? "—" : Math.round(x.comp) + "%") + "<div>" + b.t + "</div></td>" +
          "<td>" + x.mine.length + " من " + x.open + (x.hwAvg == null ? "" : '<div class="muted">متوسط ' + Math.round(x.hwAvg) + "%</div>") + "</td>" + cell(x.tAvg) + "<td>" + x.abs + "</td><td>" + x.learned + " / " + x.seen + "</td>" +
          "<td>" + fmtT(x.total) + '<div class="muted">آخر 7 أيام: ' + fmtT(x.wk) + "</div></td><td>" + (x.last ? KZ.fmtDate(x.last, true) : "—") + "</td><td>" + (x.notes.length ? x.notes.map(function (n) { return "<div>• " + esc(n) + "</div>"; }).join("") : '<span class="muted">لا ملاحظات</span>') + "</td></tr>";
      });
      h += "</tbody></table></div>";
    } else if (fwMode === "lesson" || fwMode === "week" || fwMode === "month") {
      var cols = [];
      if (fwMode === "lesson") lessons.forEach(function (l) { cols.push({ t: "د" + l.num, f: function (m) { return m.lesson_id === l.id; } }); });
      else { var size = fwMode === "week" ? 4 : 16, n = Math.ceil((lessons.length ? lessons[lessons.length - 1].num : 32) / size); for (var i = 1; i <= n; i++) (function (i) { cols.push({ t: (fwMode === "week" ? "أسبوع " : "شهر ") + i, f: function (m) { var ln = lessonIds[m.lesson_id].num; return Math.ceil(ln / size) === i; } }); })(i); }
      h += '<div class="tile tablewrap"><table class="t"><thead><tr><th>الطالب</th>' + cols.map(function (c) { return "<th>" + c.t + "</th>"; }).join("") + "<th>المتوسط</th></tr></thead><tbody>";
      shown.forEach(function (x) {
        h += "<tr><td><strong>" + esc(x.s.full_name) + "</strong></td>" + cols.map(function (c) { var ps = x.mine.filter(c.f).map(function (m) { return m.total ? m.first_score / m.total * 100 : 0; }); return cell(avg(ps)); }).join("") + cell(x.hwAvg) + "</tr>";
      });
      h += "</tbody></table></div>";
    } else {
      h += '<div class="tile tablewrap"><table class="t"><thead><tr><th>الطالب</th>' + tests.sort(function (a, b) { return a.id.localeCompare(b.id); }).map(function (t) { return '<th class="en">' + esc(t.id) + "</th>"; }).join("") + "<th>المتوسط</th></tr></thead><tbody>";
      shown.forEach(function (x) {
        h += "<tr><td><strong>" + esc(x.s.full_name) + "</strong></td>" + tests.map(function (t) { var a = attempts.filter(function (z) { return z.user_id === x.s.id && z.test_id === t.id && z.submitted_at; })[0]; return cell(a ? (a.total ? a.score / a.total * 100 : 0) : null); }).join("") + cell(x.tAvg) + "</tr>";
      });
      h += "</tbody></table></div>";
    }
    h += '<p class="muted" style="margin-top:12px">الأداء = 60% من متوسط الواجبات (درجة المحاولة الأولى) + 40% من متوسط الاختبارات. الوقت على الموقع يُحسب أثناء استخدام الطالب للمنصة فعلاً.</p>';
    view.innerHTML = h;
    $("fwL").addEventListener("change", function () { fwLevel = $("fwL").value; VIEWS.follow(); });
    $("fwM").addEventListener("change", function () { fwMode = $("fwM").value; VIEWS.follow(); });
    $("fwO").addEventListener("change", function () { fwOnly = $("fwO").checked; VIEWS.follow(); });
  };


  // ================= Fluency effort board (teacher only: story repetitions) =================
  var fluRange = "7", fluLevel = "";
  VIEWS.fluency = async function () {
    var reps = (await sb.from("story_reps").select("user_id,created_at").order("created_at", { ascending: false }).limit(20000)).data || [];
    var nm = await nameMap();
    var nks = {}; ((await sb.from("fluency_nicknames").select("*")).data || []).forEach(function (n) { nks[n.user_id] = n; });
    var since30 = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10), tm = {};
    ((await sb.from("study_time").select("user_id,seconds").gte("day", since30)).data || []).forEach(function (x) { tm[x.user_id] = (tm[x.user_id] || 0) + x.seconds; });
    var fs0 = (await sb.from("fluency_settings").select("*").eq("id", 1).maybeSingle()).data || { min_gap_seconds: 15, audio_factor: 0.5, daily_cap: 30 };
    var cut = fluRange === "all" ? 0 : Date.now() - Number(fluRange) * 86400000;
    var st = {};
    reps.forEach(function (r) {
      var t = new Date(r.created_at).getTime(); if (t < cut) return;
      var s = st[r.user_id] = st[r.user_id] || { n: 0, days: {} }; s.n++; s.days[r.created_at.slice(0, 10)] = 1;
    });
    var rows = nm.list.filter(function (p) { return !fluLevel || p.level === fluLevel; }).map(function (p) {
      var s = st[p.id] || { n: 0, days: {} };
      return { p: p, n: s.n, d: Object.keys(s.days).length, min: Math.round((tm[p.id] || 0) / 60), nk: nks[p.id] };
    }).sort(function (a, b) { return b.n - a.n || b.d - a.d; });
    var h = '<h2>الطلاقة والجهد</h2><div class="tile form" style="display:flex;gap:14px;flex-wrap:wrap;align-items:end"><div><label for="fsG">أقل فاصل بين تكرارين (ثوانٍ)</label><input id="fsG" type="number" min="0" max="600" dir="ltr" value="' + fs0.min_gap_seconds + '"></div><div><label for="fsF">نسبة من مدة الصوت (0.5 = نصف المدة، 1 = المدة كاملة، 0 = تعطيل)</label><input id="fsF" type="number" min="0" max="2" step="0.1" dir="ltr" value="' + fs0.audio_factor + '"></div><div><label for="fsC">أقصى عدد في اليوم</label><input id="fsC" type="number" min="1" max="500" dir="ltr" value="' + fs0.daily_cap + '"></div><div><button class="btn btn-primary" id="fsS" type="button">حفظ الحدود</button></div><p class="muted" style="flex-basis:100%;margin:0">الفاصل المطلوب = الأكبر بين «أقل فاصل» و«النسبة × مدة صوت الدرس». مثال: صوت 40 ثانية، النسبة 0.5، أقل فاصل 15 ← الفاصل 20 ثانية.</p></div><p class="muted">عدد مرات تكرار القصة التي سجّلها كل طالب (بحد أقصى مرة كل دقيقة و30 مرة يومياً). هذه اللوحة لك وحدك ولا يراها الطلاب.</p>' +
      '<div class="tile form" style="display:flex;gap:14px;flex-wrap:wrap;align-items:end"><div><label for="flR">الفترة</label><select id="flR"><option value="7"' + (fluRange === "7" ? " selected" : "") + '>آخر 7 أيام</option><option value="30"' + (fluRange === "30" ? " selected" : "") + '>آخر 30 يوماً</option><option value="all"' + (fluRange === "all" ? " selected" : "") + '>كل الوقت</option></select></div>' +
      '<div><label for="flL">المستوى</label><select id="flL"><option value="">الكل</option>' + opts(LEVELS, fluLevel) + '</select></div></div>' +
      '<div class="tile tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>#</th><th>الاسم</th><th>اللقب</th><th>المستوى</th><th>التكرارات</th><th>أيام النشاط</th><th>دقائق على الموقع (30 يوماً)</th><th></th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var nk = r.nk ? esc(r.nk.nickname) + (r.nk.status === "pending" ? ' <button class="btn btn-primary sm" data-nok="' + r.p.id + '" type="button">✅</button> <button class="btn danger sm" data-nno="' + r.p.id + '" type="button">✖</button>' : r.nk.status === "approved" ? ' <span class="badge ok">معتمد</span>' : ' <span class="badge bad">مرفوض</span>') : '<span class="muted">—</span>';
      h += "<tr><td>" + (i + 1) + "</td><td>" + esc(r.p.full_name) + "</td><td>" + nk + '</td><td class="en">' + esc(r.p.level) + "</td><td><strong>" + r.n + "</strong></td><td>" + r.d + "</td><td>" + r.min + '</td><td><button class="btn btn-ghost sm" data-ex="' + r.p.id + '" type="button">🏆 شهادة تفوّق</button></td></tr>';
    });
    h += "</tbody></table></div>";
    view.innerHTML = h;
    $("fsS").addEventListener("click", async function () {
      var r = await sb.from("fluency_settings").upsert({ id: 1, min_gap_seconds: Math.max(0, Math.min(600, Math.round(Number($("fsG").value) || 0))), audio_factor: Math.max(0, Math.min(2, Number($("fsF").value) || 0)), daily_cap: Math.max(1, Math.min(500, Math.round(Number($("fsC").value) || 30))) });
      KZ.toast(r.error ? "تعذر الحفظ." : "تم حفظ الحدود.", !!r.error); });
    $("flR").addEventListener("change", function () { fluRange = $("flR").value; VIEWS.fluency(); });
    $("flL").addEventListener("change", function () { fluLevel = $("flL").value; VIEWS.fluency(); });
    view.querySelectorAll("[data-nok],[data-nno]").forEach(function (b) { b.addEventListener("click", async function () {
      var ok = b.hasAttribute("data-nok"), id = b.getAttribute(ok ? "data-nok" : "data-nno");
      var r = await sb.rpc("decide_fluency_nickname", { p_user: id, p_ok: ok });
      KZ.toast(r.error ? "تعذر الحفظ." : (ok ? "تم اعتماد اللقب." : "تم رفض اللقب."), !!r.error); VIEWS.fluency(); }); });
    view.querySelectorAll("[data-ex]").forEach(function (b) { b.addEventListener("click", async function () {
      var p = nm.map[b.getAttribute("data-ex")];
      if (!confirm("إصدار «شهادة تفوّق» للطالب " + p.full_name + " تقديراً لجهده في الطلاقة؟")) return;
      var r = await sb.rpc("issue_custom_certificate", { p_user: p.id, p_kind: "excellence", p_title: "CERTIFICATE OF EXCELLENCE", p_body: "has shown outstanding effort and dedication to improving English fluency", p_level: null, p_hours: null, p_date: null });
      KZ.toast(r.error ? "تعذر الإصدار." : "تم الإصدار: " + r.data.number, !!r.error); }); });
  };

  go((location.hash || "#students").slice(1));
})();
