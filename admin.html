      '<div id="ceUsW" hidden><label for="ceUs">الطلاب (Ctrl لاختيار أكثر من واحد)</label><select id="ceUs" multiple size="8">' + nm.list.map(function (p) { return '<option value="' + p.id + '">' + esc(p.full_name) + " (" + esc(p.level || "") + ")</option>"; }).join("") + '</select></div>' +
      '<div class="btns" style="margin-top:10px"><button class="btn btn-primary" id="ceGo" type="button">إتاحة الكلمات</button></div><div id="ceRes" class="muted"></div></div>' +
      '<p class="muted" style="margin-top:14px">أُتيح اليوم ' + gr.length + ' بطاقة إضافية لـ ' + new Set(gr.map(function (x) { return x.user_id; })).size + ' طالب.</p>';
    view.innerHTML = h;
    function sync() { var a = $("ceA").value; $("ceLvW").hidden = a !== "level"; $("ceGrW").hidden = a !== "group"; $("ceUsW").hidden = a !== "users"; }
    $("ceA").addEventListener("change", sync); sync();
    $("ceGo").addEventListener("click", async function () {
      var a = $("ceA").value, n = Number($("ceN").value), val = a === "level" ? $("ceLv").value : a === "group" ? $("ceGr").value : "", us = a === "users" ? Array.from($("ceUs").selectedOptions).map(function (o) { return o.value; }) : null;
      if (!(n >= 1 && n <= 20)) { KZ.toast("اختر عدداً من 1 إلى 20.", true); return; }
      if (a === "users" && !us.length) { KZ.toast("اختر طالباً على الأقل.", true); return; }
      var who = a === "all" ? "كل الطلاب" : a === "level" ? "مستوى " + val : a === "group" ? "المجموعة المختارة" : us.length + " طالب";
      if (!confirm("إتاحة " + n + " كلمة إضافية لكل طالب من: " + who + "؟")) return;
      $("ceGo").disabled = true;
      var r = await sb.rpc("teacher_release_extra", { p_scope: a, p_value: val, p_count: n, p_users: us });
      $("ceGo").disabled = false;
      if (r.error) { KZ.toast("تعذر الإتاحة.", true); return; }
      $("ceRes").innerHTML = "✅ أُتيحت " + r.data + " بطاقة" + (r.data ? " وأُرسل التنبيه للطلاب." : " (لا توجد كلمات متبقية جديدة أو سبق إتاحتها)."); setTimeout(function () { VIEWS.cardextra(); }, 2500);
    });
  };

  // ---------- IELTS/TOEFL free resources (links shown to students) ----------
  async function examResources() {
    var box = $("exResBox"); if (!box) return;
    var rows = (await sb.from("exam_resources").select("*").order("sort")).data || [];
    box.innerHTML = '<div class="tile" style="margin-top:16px"><h3 style="margin-top:0">🆓 المصادر المجانية (تظهر للطلاب في صفحة IELTS / TOEFL)</h3>' +
      (rows.length ? rows.map(function (r) { return '<div class="row" style="padding:6px 0"><span><strong>' + esc(r.title) + '</strong> <span class="badge">' + esc(r.track) + '/' + esc(r.skill) + '</span><br><a href="' + esc(r.url) + '" target="_blank" rel="noopener" class="muted" dir="ltr">' + esc(r.url) + '</a></span><span><button class="btn btn-ghost sm" data-rtg="' + r.id + '|' + (r.published ? 0 : 1) + '" type="button">' + (r.published ? "🟢 ظاهر" : "⚪ مخفي") + '</button> <button class="btn btn-ghost sm" data-rdel="' + r.id + '" type="button">حذف</button></span></div>'; }).join("") : '<p class="muted">لا مصادر.</p>') +
      '<h4>إضافة مصدر</h4><div class="form"><div class="grid2"><div><label>العنوان</label><input id="rTitle" type="text"></div><div><label>الرابط</label><input id="rUrl" type="url" dir="ltr" placeholder="https://"></div></div><div class="grid2"><div><label>الاختبار</label><select id="rTrack"><option value="both">IELTS + TOEFL</option><option value="ielts">IELTS</option><option value="toefl">TOEFL</option></select></div><div><label>المهارة</label><select id="rSkill"><option value="all">عام</option><option value="writing">كتابة</option><option value="listening">استماع</option><option value="reading">قراءة</option><option value="speaking">محادثة</option></select></div></div><label>ملاحظة قصيرة</label><input id="rNote" type="text"></div><div class="btns" style="margin-top:8px"><button class="btn btn-primary" id="rAdd" type="button">إضافة</button></div></div>';
    box.querySelectorAll("[data-rtg]").forEach(function (b) { b.addEventListener("click", async function () { var p = b.getAttribute("data-rtg").split("|"); await sb.from("exam_resources").update({ published: p[1] === "1" }).eq("id", p[0]); examResources(); }); });
    box.querySelectorAll("[data-rdel]").forEach(function (b) { b.addEventListener("click", async function () { if (!confirm("حذف هذا المصدر؟")) return; await sb.from("exam_resources").delete().eq("id", b.getAttribute("data-rdel")); examResources(); }); });
    $("rAdd").addEventListener("click", async function () {
      var t = $("rTitle").value.trim(), u = $("rUrl").value.trim();
      if (!t || !/^https:\/\//.test(u)) { KZ.toast("اكتب العنوان ورابطاً يبدأ بـ https://", true); return; }
      var r = await sb.from("exam_resources").insert({ title: t, url: u, track: $("rTrack").value, skill: $("rSkill").value, note: $("rNote").value.trim() || null, sort: 100 + rows.length });
      KZ.toast(r.error ? "تعذرت الإضافة." : "أُضيف.", !!r.error); examResources();
    });
  }

  // ---------- speaking session bookings (single or pair) ----------
  VIEWS.bookings = async function () {
    var nm = await nameMap();
    var rows = (await sb.from("speaking_bookings").select("*").order("created_at", { ascending: false }).limit(200)).data || [];
    var ST = { pending: "⏳ جديد", confirmed: "✅ مؤكد", done: "🏁 تمّ", rejected: "❌ مرفوض", cancelled: "ملغى" };
    var f = view._bkf || "pending"; view._bkf = f;
    var list = rows.filter(function (r) { return f === "all" || r.status === f; });
    var h = '<h2>📅 حجوزات حصص المحادثة</h2><p class="muted">يطلب الطلاب حصة فردية أو ثنائية. حدّد الموعد وأكّد، وسيصلهم تنبيه على الجهاز.</p><div class="agroups">' + [["pending", "جديدة"], ["confirmed", "مؤكدة"], ["done", "منتهية"], ["all", "الكل"]].map(function (t) { return '<button type="button" data-f="' + t[0] + '" aria-selected="' + (f === t[0]) + '">' + t[1] + (t[0] === "pending" ? " (" + rows.filter(function (r) { return r.status === "pending"; }).length + ")" : "") + "</button>"; }).join("") + "</div>";
    h += list.length ? list.map(function (r) {
      var who = nm.map[r.user_id] ? nm.map[r.user_id].full_name : "طالب";
      return '<div class="tile" style="margin-top:10px"><div class="row" style="border:0;padding:0"><div><strong>' + esc(who) + '</strong> ' + (r.kind === "pair" ? "👥 مع: " + esc(r.partner_name || "—") : "👤 فردية") + ' <span class="badge">' + esc(r.level || "") + '</span></div><span class="badge gold">' + ST[r.status] + '</span></div>' +
        (r.topic ? '<p style="margin:6px 0"><strong>الموضوع:</strong> ' + esc(r.topic) + "</p>" : "") + '<p style="margin:6px 0"><strong>الأوقات المناسبة:</strong> ' + esc(r.preferred || "") + "</p>" +
        (r.scheduled_at ? '<p style="margin:6px 0"><strong>الموعد:</strong> ' + new Date(r.scheduled_at).toLocaleString("ar") + "</p>" : "") + (r.teacher_note ? '<p class="muted">ملاحظتك: ' + esc(r.teacher_note) + "</p>" : "") +
        (r.status === "pending" || r.status === "confirmed" ? '<div class="form" style="margin-top:8px"><div class="grid2"><div><label>الموعد</label><input type="datetime-local" data-at="' + r.id + '" value="' + (r.scheduled_at ? new Date(new Date(r.scheduled_at).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "") + '"></div><div><label>ملاحظة للطلاب (رابط الاجتماع مثلاً)</label><input type="text" data-nt="' + r.id + '" value="' + esc(r.teacher_note || "") + '"></div></div><div class="btns" style="margin-top:6px"><button class="btn btn-primary sm" data-ok="' + r.id + '" type="button">✅ تأكيد</button>' + (r.status === "confirmed" ? '<button class="btn btn-ghost sm" data-dn="' + r.id + '" type="button">🏁 تمّت</button>' : "") + '<button class="btn btn-ghost sm" data-rj="' + r.id + '" type="button">❌ رفض</button></div></div>' : "") +
        '<div class="btns" style="margin-top:6px"><button class="btn btn-ghost sm" data-bd="' + r.id + '" type="button">🗑 حذف</button></div></div>';
    }).join("") : '<div class="tile"><p class="muted" style="margin:0">لا حجوزات هنا.</p></div>';
    view.innerHTML = h;
    view.querySelectorAll("[data-f]").forEach(function (b) { b.addEventListener("click", function () { view._bkf = b.getAttribute("data-f"); VIEWS.bookings(); }); });
    async function upd(id, patch) { var r = await sb.from("speaking_bookings").update(patch).eq("id", id); KZ.toast(r.error ? "تعذر الحفظ." : "تم.", !!r.error); VIEWS.bookings(); }
    view.querySelectorAll("[data-ok]").forEach(function (b) { b.addEventListener("click", function () { var id = b.getAttribute("data-ok"), at = view.querySelector('[data-at="' + id + '"]').value; if (!at) { KZ.toast("اختر موعداً أولاً.", true); return; } upd(id, { status: "confirmed", scheduled_at: new Date(at).toISOString(), teacher_note: view.querySelector('[data-nt="' + id + '"]').value.trim() || null }); }); });
    view.querySelectorAll("[data-dn]").forEach(function (b) { b.addEventListener("click", function () { upd(b.getAttribute("data-dn"), { status: "done" }); }); });
    view.querySelectorAll("[data-rj]").forEach(function (b) { b.addEventListener("click", function () { var id = b.getAttribute("data-rj"); upd(id, { status: "rejected", teacher_note: view.querySelector('[data-nt="' + id + '"]').value.trim() || null }); }); });
    view.querySelectorAll("[data-bd]").forEach(function (b) { b.addEventListener("click", async function () { if (!confirm("حذف الحجز؟")) return; await sb.from("speaking_bookings").delete().eq("id", b.getAttribute("data-bd")); VIEWS.bookings(); }); });
  };

  // ---------- events for the teacher (students who changed their password, ...) ----------
  VIEWS.events = async function () {
    var nm = await nameMap();
    var rows = (await sb.from("teacher_events").select("*").order("created_at", { ascending: false }).limit(100)).data || [];
    var KI = { pw: "🔑 غيّر كلمة المرور" };
    var h = '<h2>🔔 أحداث الطلاب</h2><p class="muted">تظهر هنا أحداث مثل تغيير الطالب لكلمة مروره. تتحكم في هذا التنبيه من الميزات (مفتاح «إشعاري عندما يغيّر طالب كلمة مروره»).</p><div class="btns" style="margin-bottom:10px"><button class="btn btn-primary sm" id="evAll" type="button">تم الاطلاع على الكل</button><button class="btn btn-ghost sm" id="evDel" type="button">حذف المقروء</button></div>';
    h += rows.length ? rows.map(function (e) { var who = nm.map[e.student_id] ? nm.map[e.student_id].full_name : (e.note || "طالب"); return '<div class="row" style="' + (e.seen ? "opacity:.6" : "") + '"><span><strong>' + esc(who) + '</strong> ' + (KI[e.kind] || esc(e.kind)) + ' <span class="muted">· ' + new Date(e.created_at).toLocaleString("ar", { dateStyle: "medium", timeStyle: "short" }) + "</span></span>" + (e.seen ? "" : '<span class="badge gold">جديد</span>') + "</div>"; }).join("") : '<p class="muted">لا أحداث بعد.</p>';
    view.innerHTML = h;
    $("evAll").addEventListener("click", async function () { await sb.from("teacher_events").update({ seen: true }).eq("seen", false); KZ.toast("تم."); VIEWS.events(); });
    $("evDel").addEventListener("click", async function () { await sb.from("teacher_events").delete().eq("seen", true); KZ.toast("تم."); VIEWS.events(); });
  };

  if (!IS_OWNER) {
    var rb = document.createElement("div"); rb.className = "infobox"; rb.style.margin = "0 0 12px";
    rb.innerHTML = "👩‍🏫 حساب معلم مساعد: التواصل مع الطلاب يكون <strong>داخل الموقع فقط</strong> (تبويب الرسائل). ممنوع طلب أو مشاركة أرقام أو حسابات خارجية. نشاطك مسجّل لدى المدير.";
    app.insertBefore(rb, app.children[1] || null);
    if (STAFF.perms.indexOf("contact") < 0) {
      // hide phone numbers (interface-level)
      var mask = function (root) { var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = []; while ((n = w.nextNode())) { if (/\d[\d\s-]{7,}\d/.test(n.nodeValue)) list.push(n); } list.forEach(function (t) { t.nodeValue = t.nodeValue.replace(/\+?\d[\d\s-]{7,}\d/g, "••••••"); }); document.querySelectorAll("#view option").forEach(function (o) { if (/\d{8,}/.test(o.textContent)) o.textContent = o.textContent.replace(/\+?\d[\d\s-]{7,}\d/g, "••••••"); }); };
      var mt = null; new MutationObserver(function () { clearTimeout(mt); mt = setTimeout(function () { mask(view); }, 150); }).observe(view, { childList: true, subtree: true });
    }
    sb.from("staff_warnings").select("*").is("seen_at", null).order("created_at").then(function (r) {
      var ws = r.data || []; if (!ws.length) return;
      var ov = document.createElement("div"); ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
      ov.innerHTML = '<div class="tile" style="max-width:480px;width:100%;background:var(--surface,#fff);color:var(--text,#111)" role="dialog" aria-label="تحذير من الإدارة"><h2 style="margin-top:0;color:#c62828">⚠️ تحذير من الإدارة</h2>' + ws.map(function (w) { return '<div class="warnbox" style="margin:8px 0">' + esc(w.note) + '<div class="muted" style="font-size:.8rem">' + new Date(w.created_at).toLocaleString("ar") + "</div></div>"; }).join("") + '<div class="btns"><button class="btn btn-primary" id="wAck" type="button">اطلعتُ على التحذير</button></div></div>';
      document.body.appendChild(ov); document.getElementById("wAck").onclick = async function () { await sb.rpc("staff_ack_warnings"); ov.remove(); };
    });
  }
  go((location.hash || "#students").slice(1));
  window.addEventListener("hashchange", function () { go((location.hash || "#students").slice(1)); });
})();

</script>
</body>
