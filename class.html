<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>صفحة الحصة · KIMZA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=mwvum8yn">
<link rel="stylesheet" href="app.css?v=mwvum8yn">

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwvum8yn"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("teacher");
  if (!prof) return;
  KZ.shell("admin");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var id = new URLSearchParams(location.search).get("id") || "";
  var c = await sb.from("lesson_content").select("body").eq("lesson_id", id).eq("kind", "class").maybeSingle();
  if (!c.data) { app.innerHTML = '<h1>لا توجد صفحة حصة لهذا الدرس</h1><p><a href="admin.html">العودة</a></p>'; return; }
  app.innerHTML = '<p><a href="admin.html">&larr; لوحة المعلم</a></p><h1>صفحة الحصة <span class="en muted">' + esc(id) + '</span></h1><iframe class="frame" id="cls" style="min-height:85vh" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="Class"></iframe>';
  document.getElementById("cls").srcdoc = c.data.body;
})();

</script>
</body>
</html>
