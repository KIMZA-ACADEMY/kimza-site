<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>المراجعة · KIMZA Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet"></noscript>
<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwxbwf29">
<link rel="stylesheet" href="app.css?v=mwxbwf29">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwxbwf29"></script>
<script src="portal-i18n.js?v=mwxbwf29"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("student");
  if (!prof) return;
  KZ.shell("review");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app");
  var NEW_LIMIT = 10; // new cards per day

  var cards = (await sb.from("flashcards").select("id,lesson_num,english,arabic,example_en,example_ar,image,audio,example_audio").in("level", KZ.levelsOf(prof)).order("level").order("lesson_num").order("id")).data || [];
  var progRows = (await sb.from("card_progress").select("*")).data || [];
  var prog = {}; progRows.forEach(function (p) { prog[p.card_id] = p; });
  var byId = {}; cards.forEach(function (c) { byId[c.id] = c; });

  var startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  var endToday = new Date(); endToday.setHours(23, 59, 59, 999);

  if (!cards.length) {
    app.innerHTML = '<h1>مراجعة البطاقات</h1><div class="tile"><p class="muted">لا توجد بطاقات بعد. تظهر بطاقات كل درس عندما يفتح المعلم «الكلمات» لذلك الدرس.</p></div>';
    return;
  }

  // ----- the spaced repetition scheduler (SM-2 style, like Anki) -----
  var STEPS = [1, 10]; // learning steps in minutes, like AnkiDroid's default
  function schedule(p, r, now) {
    var s = p ? JSON.parse(JSON.stringify(p)) : { state: "learning", interval_days: 0, ease: 2.5, reps: 0, lapses: 0, step: 0 };
    s.step = Number(s.step) || 0;
    function mins(m) { return new Date(now + m * 60000); }
    function days(d) { return new Date(now + d * 86400000); }
    function graduate(easy) {
      s.state = "review"; s.step = 0;
      if (s.reps > 0) s.interval_days = easy ? Math.max(Number(s.interval_days) + 1, Math.round(Number(s.interval_days) * 1.5)) : Math.max(1, Math.round(Number(s.interval_days)));
      else s.interval_days = easy ? 4 : 1;
      s.due = days(s.interval_days); s.reps++;
    }
    if (s.state === "learning") {
      if (r === "again") { s.step = 0; s.due = mins(STEPS[0]); }
      else if (r === "hard") { s.due = mins(s.step === 0 && STEPS.length > 1 ? Math.round((STEPS[0] + STEPS[1]) / 2) : STEPS[Math.min(s.step, STEPS.length - 1)]); }
      else if (r === "good") { if (s.step + 1 < STEPS.length) { s.step++; s.due = mins(STEPS[s.step]); } else graduate(false); }
      else graduate(true);
    } else {
      var iv = Number(s.interval_days), ease = Number(s.ease);
      if (r === "again") { s.lapses++; s.ease = Math.max(1.3, ease - 0.2); s.state = "learning"; s.interval_days = Math.max(1, Math.round(iv * 0.5)); s.step = STEPS.length - 1; s.due = mins(STEPS[STEPS.length - 1]); }
      else if (r === "hard") { s.interval_days = Math.max(iv + 1, Math.round(iv * 1.2)); s.ease = Math.max(1.3, ease - 0.15); s.due = days(s.interval_days); s.reps++; }
      else if (r === "good") { s.interval_days = Math.max(iv + 1, Math.round(iv * ease)); s.due = days(s.interval_days); s.reps++; }
      else { s.interval_days = Math.max(iv + 1, Math.round(iv * ease * 1.3)); s.ease = ease + 0.15; s.due = days(s.interval_days); s.reps++; }
    }
    s.last_reviewed = new Date(now);
    return s;
  }
  function label(s, now) {
    var diff = (new Date(s.due).getTime() - now) / 60000;
    if (diff < 60) return Math.max(1, Math.round(diff)) + " د";
    if (diff < 1440) return Math.round(diff / 60) + " س";
    return Math.round(diff / 1440) + " ي";
  }

  // ----- today's queue -----
  var now0 = Date.now();
  var learningDue = [], reviewDue = [], fresh = [];
  cards.forEach(function (c) {
    var p = prog[c.id];
    if (!p) { fresh.push(c.id); return; }
    var due = new Date(p.due);
    if (p.state === "learning" && due.getTime() <= now0 + 20 * 60000) learningDue.push(c.id);
    else if (p.state === "review" && due <= endToday) reviewDue.push(c.id);
  });
  reviewDue.sort(function (a, b) { return new Date(prog[a].due) - new Date(prog[b].due); });
  var newToday = progRows.filter(function (p) { return new Date(p.first_seen) >= startToday && byId[p.card_id]; }).length;
  var newAllowed = Math.max(0, NEW_LIMIT - newToday);
  var queue = learningDue.concat(reviewDue).concat(fresh.slice(0, newAllowed));
  var stat = { nw: Math.min(fresh.length, newAllowed), lr: learningDue.length, rv: reviewDue.length };
  var total = queue.length, doneCount = 0, showing = false;

  var BASE = window.KIMZA_SUPABASE.url + "/storage/v1/object/public/card-media/";
  var cur = null, loopMode = null, loopTimer = null;
  var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4];
  var SPEED = 1;
  try { SPEED = Number(localStorage.getItem("kz-speed")) || 1; } catch (e) {}
  function playFile(file, fallbackText, then) {
    try { if (cur) cur.pause(); } catch (e) {}
    if (!file) { if (fallbackText) speak(fallbackText, then); else if (then) then(); return; }
    cur = new Audio(BASE + file);
    cur.playbackRate = SPEED;
    if (then) cur.addEventListener("ended", then);
    cur.play().catch(function () { if (fallbackText) speak(fallbackText, then); });
  }
  function speak(text, then) {
    if (!("speechSynthesis" in window)) { KZ.toast("متصفحك لا يدعم النطق.", true); return; }
    var u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = Math.min(2, 0.9 * SPEED);
    if (then) u.onend = then;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  // Repeat the word or the example again and again (shadowing) until the student presses the button again.
  function stopLoop() { loopMode = null; clearTimeout(loopTimer); try { if (cur) cur.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
  function toggleLoop(which, c) {
    if (loopMode === which) { stopLoop(); render(); return; }
    stopLoop(); loopMode = which;
    (function run() {
      if (loopMode !== which || queue[0] !== c.id) return;
      playFile(which === "word" ? c.audio : c.example_audio, which === "word" ? c.english : (c.example_en || c.english), function () {
        if (loopMode === which) loopTimer = setTimeout(run, 900);
      });
    })();
    render();
  }

  function finished() {
    var nextDue = progRows.concat(Object.keys(prog).map(function (k) { return prog[k]; })).filter(function (p) { return byId[p.card_id] && new Date(p.due) > new Date(); })
      .sort(function (a, b) { return new Date(a.due) - new Date(b.due); })[0];
    var unseen = cards.filter(function (c) { return !prog[c.id]; }).length;
    app.innerHTML = '<h1>مراجعة البطاقات</h1><div class="tile" style="text-align:center;padding:36px"><div style="font-size:3rem">🎉</div><h2>' + (total ? "أحسنت! أنهيت مراجعة اليوم" : "لا توجد بطاقات مستحقة الآن") + '</h2>' +
      '<p class="muted">' + (total ? "راجعت " + doneCount + " بطاقة." : "") + (unseen ? " تبقى " + unseen + " بطاقة جديدة (نعرض " + NEW_LIMIT + " جديدة كل يوم)." : " راجعت كل البطاقات المفتوحة.") + '</p>' +
      (nextDue ? '<p class="muted">أقرب مراجعة قادمة: ' + KZ.fmtDate(nextDue.due, true) + "</p>" : "") +
      '<p><a class="btn btn-primary" href="dashboard.html">العودة للرئيسية</a></p></div>';
  }

  function render() {
    if (!queue.length) return finished();
    var c = byId[queue[0]], p = prog[c.id];
    var counts = '<div class="row" style="border:0;padding:0"><span class="badge gold">جديد ' + queue.filter(function (id) { return !prog[id]; }).length + '</span><span class="badge">تعلّم ' + queue.filter(function (id) { return prog[id] && prog[id].state === "learning"; }).length + '</span><span class="badge ok">مراجعة ' + queue.filter(function (id) { return prog[id] && prog[id].state === "review"; }).length + "</span></div>";
    var bar = '<div class="bar" style="margin:10px 0"><i style="width:' + Math.round(doneCount / Math.max(1, total) * 100) + '%"></i></div>';
    var front = '<div class="face" id="face" style="min-height:260px"><div>' + (c.image ? '<img src="' + esc(BASE + c.image) + '" alt="" style="max-width:220px;max-height:180px;border-radius:12px;margin-bottom:14px">' : "") + '<div style="font-size:2.6rem;font-weight:800">' + esc(c.arabic || "") + '</div></div></div>';
    var back = '<div class="face" id="face" style="min-height:260px"><div>' + (c.image ? '<img src="' + esc(BASE + c.image) + '" alt="" style="max-width:160px;max-height:120px;border-radius:10px;margin-bottom:10px">' : "") + '<div style="font-size:1.3rem;color:var(--link);font-weight:700">' + esc(c.arabic || "") + '</div><div dir="ltr" style="display:block;clear:both;font-size:2.4rem;font-family:var(--font-display);font-weight:700;margin:6px 0">' + esc(c.english) + '</div><div class="btns" style="justify-content:center"><button class="btn btn-ghost sm" id="spk" type="button">🔊 استمع</button><button class="btn ' + (loopMode === "word" ? "btn-primary" : "btn-ghost") + ' sm" id="loopW" type="button" aria-pressed="' + (loopMode === "word") + '">' + (loopMode === "word" ? "⏹ أوقف التكرار" : "🔁 كرّر الكلمة") + '</button></div><p dir="ltr" class="muted" style="display:block;margin:14px 0 4px">' + esc(c.example_en || "") + '</p><p class="muted" style="margin:0">' + esc(c.example_ar || "") + '</p><div class="btns" style="justify-content:center;margin-top:10px"><button class="btn btn-ghost sm" id="spk2" type="button">🔊 استمع للمثال</button><button class="btn ' + (loopMode === "ex" ? "btn-primary" : "btn-ghost") + ' sm" id="loopE" type="button" aria-pressed="' + (loopMode === "ex") + '">' + (loopMode === "ex" ? "⏹ أوقف التكرار" : "🔁 كرّر المثال") + '</button></div></div></div>';
    var speedBar = '<div class="speedbar"><label for="spd">سرعة الصوت</label><select id="spd">' + SPEEDS.map(function (v) { return '<option value="' + v + '"' + (v === SPEED ? " selected" : "") + ">" + v + "x</option>"; }).join("") + "</select></div>";
    var now = Date.now();
    var btns = showing
      ? ["again|مرة أخرى|bad", "hard|صعبة|", "good|جيدة|ok", "easy|سهلة|gold"].map(function (x) {
          var a = x.split("|"); return '<button class="btn ' + (a[0] === "good" ? "btn-primary" : "btn-ghost") + '" data-r="' + a[0] + '" type="button" style="flex:1;flex-direction:column;gap:2px;padding:10px 6px">' + a[1] + '<small style="font-weight:400;opacity:.8">' + label(schedule(p, a[0], now), now) + "</small></button>";
        }).join("")
      : '<button class="btn btn-primary" id="show" type="button" style="flex:1">اعرض الإجابة</button>';
    app.innerHTML = '<h1>مراجعة البطاقات</h1>' + counts + bar + speedBar + '<div class="flash" style="max-width:560px;margin:14px auto">' + (showing ? back : front) + '</div><div class="btns" style="max-width:560px;margin:0 auto;gap:8px">' + btns + '</div>';
    var spd = document.getElementById("spd"); if (spd) spd.addEventListener("change", function () { SPEED = Number(spd.value); try { localStorage.setItem("kz-speed", String(SPEED)); } catch (e) {} if (cur) cur.playbackRate = SPEED; });
    var lw = document.getElementById("loopW"); if (lw) lw.addEventListener("click", function () { toggleLoop("word", c); });
    var le = document.getElementById("loopE"); if (le) le.addEventListener("click", function () { toggleLoop("ex", c); });
    var spk = document.getElementById("spk"); if (spk) spk.addEventListener("click", function () { playFile(c.audio, c.english); });
    var spk2 = document.getElementById("spk2"); if (spk2) spk2.addEventListener("click", function () { playFile(c.example_audio, c.example_en || c.english); });
    function reveal() { showing = true; render(); playFile(c.audio, c.english, function () { setTimeout(function () { if (showing && queue[0] === c.id) playFile(c.example_audio, c.example_en); }, 400); }); }
    if (!showing) { document.getElementById("show").addEventListener("click", reveal); document.getElementById("face").addEventListener("click", reveal); }
    else app.querySelectorAll("[data-r]").forEach(function (b) { b.addEventListener("click", function () { answer(c, b.getAttribute("data-r")); }); });
  }

  async function answer(c, r) {
    stopLoop(); KZ.logAct("card_review", "", 1);
    var now = Date.now(), p = prog[c.id];
    var s = schedule(p, r, now);
    var row = { user_id: KZ.user.id, card_id: c.id, state: s.state, due: new Date(s.due).toISOString(), interval_days: s.interval_days, ease: s.ease, reps: s.reps, lapses: s.lapses, step: s.step, last_reviewed: new Date(now).toISOString() };
    if (!p) row.first_seen = new Date(now).toISOString();
    var res = await sb.from("card_progress").upsert(row, { onConflict: "user_id,card_id" });
    if (res.error) { KZ.toast("تعذر الحفظ. تحقق من الاتصال.", true); return; }
    prog[c.id] = Object.assign({}, p || {}, row);
    progRows = Object.keys(prog).map(function (k) { return prog[k]; });
    queue.shift(); showing = false;
    if (s.state === "learning") { var soon = (new Date(s.due).getTime() - now) <= 120000; if (soon) queue.splice(Math.min(3, queue.length), 0, c.id); else queue.push(c.id); } else doneCount++;
    render();
  }

  render();
})();

</script>
</body>
</html>
