<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>رسائلي · KIMZA Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet"></noscript>
<script>try{var t=localStorage.getItem("kimza-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var l=localStorage.getItem("kimza-lang")==="en"?"en":"ar";document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl")}catch(e){}</script>
<link rel="stylesheet" href="site.css?v=mwzmb3az">
<link rel="stylesheet" href="app.css?v=mwzmb3az">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script>
<script>(function(){var shown=false;function show(){if(shown||window.KZ)return;shown=true;var d=document.createElement("div");d.id="kzGuard";d.style.cssText="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#0B1F44;color:#fff;padding:12px 16px;text-align:center;font:15px/1.6 Tahoma,Arial,sans-serif";d.innerHTML='الصفحة لا تكتمل التحميل؟ قد يكون الاتصال ضعيفاً أو متصفحك قديماً. <a href="check.html" style="color:#D4AF37;font-weight:bold">اضغط هنا لاختبار الاتصال</a>';(document.body||document.documentElement).appendChild(d)}function hide(){var e=document.getElementById("kzGuard");if(e&&e.parentNode)e.parentNode.removeChild(e)}addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="SCRIPT")setTimeout(show,300)},true);setTimeout(function(){show();var i=setInterval(function(){if(window.KZ){hide();clearInterval(i)}},1000)},9000)})()</script>

</head>
<body class="app">
<header class="app-nav" id="appHeader"></header>
<main class="app-main" id="app"><p class="muted">جارٍ التحميل...</p></main>
<script src="supabase-lib.js"></script>
<script src="config.js"></script>
<script src="app.js?v=mwzmb3az"></script>
<script src="portal-i18n.js?v=mwzmb3az"></script>

<script>
(async function () {
  var prof = await KZ.requireAuth("student");
  if (!prof) return;
  KZ.shell("messages");
  var sb = KZ.sb, esc = KZ.esc, app = document.getElementById("app"), uid = KZ.user.id;
  function when(d) { return new Date(d).toLocaleString("ar", { dateStyle: "short", timeStyle: "short" }); }
  async function load() {
    var rows = (await sb.from("direct_messages").select("*").eq("student_id", uid).order("created_at").limit(300)).data || [];
    var h = '<h1>رسائلي مع المعلم</h1><p class="muted">محادثة خاصة بينك وبين المعلم فقط. لا يراها أي طالب آخر. اسأل عن أي شيء يخص دراستك.</p><div class="tile"><div id="dmBox" style="max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px">';
    if (!rows.length) h += '<p class="muted" style="margin:0">لا توجد رسائل بعد. اكتب سؤالك بالأسفل.</p>';
    var MAP = {}; rows.forEach(function (m) { MAP[m.id] = m; });
    rows.forEach(function (m) {
      h += '<div data-mid="' + m.id + '" style="touch-action:pan-y;align-self:' + (m.from_teacher ? "flex-start" : "flex-end") + ';max-width:85%;background:' + (m.from_teacher ? "var(--surface)" : "var(--gold-soft, #f3e7bd)") + ';border:1px solid var(--line);border-radius:14px;padding:8px 12px"><small class="muted">' + (m.from_teacher ? "المعلم" : "أنت") + " · " + when(m.created_at) + KZ.replyBtn(m.id) + '</small>' + KZ.quote(MAP[m.reply_to]) + '<div style="white-space:pre-wrap">' + esc(m.body) + "</div></div>";
    });
    h += '</div><div class="form" style="margin-top:12px"><label for="dmT">رسالتك للمعلم</label><textarea id="dmT" rows="3" maxlength="1500"></textarea><div class="btns" style="margin-top:8px"><button class="btn btn-primary" id="dmS" type="button">إرسال</button></div><p class="muted" style="margin:6px 0 0">لا تكتب كلمات مرور أو بيانات بنكية هنا.</p></div></div>';
    app.innerHTML = h;
    var box = document.getElementById("dmBox"); box.scrollTop = box.scrollHeight;
    var RP = KZ.chatReply(box, document.getElementById("dmT"), function (id) { return MAP[id]; });
    KZ.voiceDecorate(box, MAP);
    KZ.voiceBarAfter(document.getElementById("dmS"), async function (blob, secs, ext) {
      var path = await KZ.voiceUpload(blob, ext);
      var r = await sb.from("direct_messages").insert({ student_id: uid, from_teacher: false, kind: "chat", body: "🎙 رسالة صوتية", audio_path: path, audio_secs: secs, reply_to: RP.get() });
      if (r.error) throw new Error(/too many/.test(r.error.message) ? "أرسلت رسائل كثيرة. انتظر قليلاً." : r.error.message);
      KZ.toast("وصلت رسالتك الصوتية للمعلم."); load();
    });
    document.getElementById("dmS").addEventListener("click", async function (ev) {
      var t = document.getElementById("dmT").value.trim(); if (!t) return;
      ev.target.disabled = true;
      var r = await sb.from("direct_messages").insert({ student_id: uid, from_teacher: false, kind: "chat", body: t, reply_to: RP.get() });
      if (r.error) { KZ.toast(/too many/.test(r.error.message) ? "أرسلت رسائل كثيرة. انتظر قليلاً." : "تعذر الإرسال.", true); ev.target.disabled = false; return; }
      KZ.toast("وصلت رسالتك للمعلم."); load();
    });
  }
  await load();
  try { await sb.rpc("mark_messages_read"); } catch (e) {}
})();

</script>
</body>
</html>
